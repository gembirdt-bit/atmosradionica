<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<title>Atmos Radionica — Auto servis</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="description" content="Radni nalozi, vozila, mehaničari, podsetnici na servis, predračun i račun za auto servis">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--acc:#ea580c;--bg:#111318;--bg2:#171a21;--card:#1b1f27;--card2:#252a35;--line:rgba(255,255,255,.1);--txt:#f1f3f7;--muted:#9aa3b2;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--r:14px;--nav:64px}
:root[data-theme=light]{--bg:#f3f4f6;--bg2:#e9ebef;--card:#fff;--card2:#f1f3f6;--line:rgba(20,30,50,.13);--txt:#151a24;--muted:#5d6676;--ok:#059669;--warn:#b45309;--bad:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:calc(var(--nav) + 90px + env(safe-area-inset-bottom))}
body.fs-l{font-size:112%}body.fs-s{font-size:92%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 14px;font-size:.9rem}
button:active{transform:scale(.98)}
button:disabled{opacity:.45}
.btn-p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn-d{background:rgba(248,113,113,.14);color:var(--bad);border-color:rgba(248,113,113,.4)}
.btn-s{padding:6px 10px;font-size:.8rem;border-radius:10px}
.fld{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:1rem}
.fld:focus{outline:2px solid var(--acc);outline-offset:-1px}
textarea.fld{resize:vertical}
select.fld option{color:#000}
label.l{display:block;font-size:.72rem;color:var(--muted);margin:0 0 4px 2px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.top-in{max-width:1100px;margin:auto;display:flex;gap:8px;align-items:center}
.logo{font-weight:800;letter-spacing:.5px;white-space:nowrap}.logo b{color:var(--acc)}
.shopname{flex:1;min-width:0;text-align:right;color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shell{max-width:1100px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:.95rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;border-left:4px solid var(--acc)}
.stat small{color:var(--muted);font-size:.72rem;display:block}.stat b{font-size:1.25rem;display:block;margin-top:2px}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:.8rem}
.item{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:8px}
.item .amt{font-weight:700;white-space:nowrap;text-align:right}
.item.dim{opacity:.7}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:.72rem;font-weight:700;white-space:nowrap}
.b-ok{background:rgba(52,211,153,.18);color:var(--ok)}.b-warn{background:rgba(251,191,36,.2);color:var(--warn)}.b-bad{background:rgba(248,113,113,.2);color:var(--bad)}.b-n{background:var(--card2);color:var(--muted)}
.plate{display:inline-block;border:2px solid #111;border-radius:6px;padding:0 8px;font-weight:800;letter-spacing:1px;background:#fff;color:#111;font-size:.95rem}
.alert{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:.9rem}
.alert.bad{background:rgba(248,113,113,.15);border:1px solid rgba(248,113,113,.4)}.alert.warn{background:rgba(251,191,36,.15);border:1px solid rgba(251,191,36,.4)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg2);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;border-radius:0;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;color:var(--muted);height:var(--nav)}
nav button span{font-size:1.3rem}nav button.on{color:var(--acc);font-weight:700}
nav .sec{display:none}
.fab{position:fixed;right:16px;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom));z-index:25;width:58px;height:58px;border-radius:50%;background:var(--acc);border:0;color:#fff;font-size:2rem;line-height:1;box-shadow:0 6px 20px rgba(0,0,0,.4);padding:0}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--txt);width:min(620px,calc(100% - 16px));max-height:94vh;padding:0;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg{padding:16px}.dlg h3{margin:0 0 12px}.dlg h4{margin:14px 0 8px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 90px);transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:12px;z-index:200;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:36px;height:36px;border-radius:50%;padding:0;border:3px solid transparent}.sw button.on{border-color:var(--txt)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px;overflow-x:auto}.seg button{flex:1;border:0;background:none;padding:8px 8px;border-radius:9px;font-size:.82rem;white-space:nowrap}.seg button.on{background:var(--acc);color:#fff;font-weight:600}
table.tb{width:100%;border-collapse:collapse;font-size:.82rem}.tb td,.tb th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}.tb td:first-child,.tb th:first-child{text-align:left}.tb th{color:var(--muted);font-weight:600;font-size:.72rem}
.more{display:grid;gap:10px}.more button{display:flex;align-items:center;gap:12px;padding:16px;text-align:left;font-size:1rem}
.irow{display:grid;grid-template-columns:auto 70px 1fr auto;gap:6px;margin-bottom:10px;padding:8px;border:1px solid var(--line);border-radius:12px}
.irow .nm{grid-column:1/-1}.irow .fld{padding:8px 10px;font-size:.95rem}
.scban{border:1px dashed var(--acc);border-radius:12px;padding:10px;margin:0 0 12px}.scban .small{margin-bottom:8px}
.scbar{height:8px;border-radius:6px;background:var(--card2);overflow:hidden;margin:14px 0 6px}.scbar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
details.raw{margin:0 0 12px;font-size:.8rem;color:var(--muted)}details.raw pre{white-space:pre-wrap;max-height:140px;overflow:auto;background:var(--card2);padding:8px;border-radius:8px}
.upd{position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top));z-index:150;background:var(--acc);color:#fff;border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.upd[hidden]{display:none}.upd button{background:#fff;color:#111;border:0;font-weight:700}
#docView{position:fixed;inset:0;z-index:100;background:#cfd3da;overflow:auto}#docView[hidden]{display:none}
.dtool{position:sticky;top:0;background:#111318;padding:8px 12px;display:flex;gap:8px;z-index:2}
.doc{background:#fff;color:#111;max-width:820px;margin:12px auto;padding:26px;font:13.5px/1.45 Arial,Helvetica,sans-serif;box-shadow:0 4px 20px rgba(0,0,0,.25)}
.doc h1{font-size:22px;margin:0}.doc h2{font-size:13px;margin:14px 0 4px;text-transform:uppercase;color:#444;border-bottom:1px solid #999;padding-bottom:2px}
.doc table{width:100%;border-collapse:collapse}.doc .items th{background:#eee;text-align:left;border:1px solid #999;padding:5px 6px;font-size:12px}.doc .items td{border:1px solid #bbb;padding:5px 6px;vertical-align:top}
.doc .r{text-align:right}.doc .c{text-align:center}.doc .hd{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #111;padding-bottom:10px}
.doc .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.doc .tot{margin-left:auto;width:290px;margin-top:8px}.doc .tot td{padding:3px 6px}.doc .tot .g td{font-weight:700;font-size:15px;border-top:2px solid #111}
.doc .sig{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:46px}.doc .sig div{border-top:1px solid #111;text-align:center;padding-top:4px;font-size:12px}
.doc .st{display:inline-block;border:1.5px solid #111;padding:1px 8px;border-radius:4px;font-weight:700;font-size:12px}
.doc p{margin:4px 0}
@media(max-width:560px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}.doc{padding:14px;margin:0}.doc .two{grid-template-columns:1fr}.doc .tot{width:100%}}
@media(min-width:900px){
 body{padding-bottom:30px;padding-left:210px}
 nav{top:0;bottom:0;width:210px;right:auto;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:70px 8px 8px;overflow-y:auto;gap:2px}
 nav button{flex:none;flex-direction:row;height:46px;font-size:.95rem;gap:12px;padding:0 14px;justify-content:flex-start;border-radius:12px}
 nav .sec{display:flex}nav .morebtn{display:none}
 .top{margin-left:-210px;padding-left:222px}
 .fab{bottom:24px;right:24px}.toast{bottom:30px}
}
@media print{
 @page{size:A4 portrait;margin:12mm}
 body>*:not(#docView){display:none!important}
 body{padding:0!important;background:#fff!important}
 #docView{position:static!important;background:#fff;overflow:visible!important}
 .dtool{display:none!important}
 .doc{box-shadow:none;margin:0;padding:0;max-width:none}
}
/* prijava / režim samo za pregled */
#authBtn{white-space:nowrap}
body.ro #authBtn{border-color:var(--warn);color:var(--warn)}
body.ro [data-act=neword],body.ro [data-act=editord],body.ro [data-act=delord],body.ro [data-act=stnext],body.ro [data-act=paid],
body.ro [data-act=newveh],body.ro [data-act=editveh],body.ro [data-act=delveh],body.ro [data-act=newrem],body.ro [data-act=editrem],
body.ro [data-act=delrem],body.ro [data-act=remdone],body.ro [data-act=remundo],body.ro [data-act=newmech],body.ro [data-act=editmech],
body.ro [data-act=delmech],body.ro [data-act=import],body.ro [data-act=restore],body.ro [data-act=reset],body.ro [data-act=scancam],
body.ro [data-act=scanpick],body.ro [data-act=newpart],body.ro [data-act=editpart],body.ro [data-act=delpart],body.ro [data-act=partnext],body.ro [data-act=logopick],body.ro [data-act=logodel],body.ro [data-act=msgreset]{display:none!important}
.roBar{background:rgba(251,191,36,.14);color:var(--warn);border:1px solid rgba(251,191,36,.4);border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:.85rem}
#authDlg::backdrop{background:rgba(0,0,0,.65)}
.supLink{display:inline-block;padding:10px 14px;border:1px solid var(--line);background:var(--card2);border-radius:12px;color:var(--txt);text-decoration:none;font-size:.9rem}
.supLink.wa{background:#25d366;border-color:#25d366;color:#fff;font-weight:600}
.supCard{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin:18px 4px 8px;padding-top:12px;border-top:1px solid var(--line);font-size:.82rem}
.supCard a{color:var(--muted);text-decoration:none;white-space:nowrap}.supCard a:hover{color:var(--txt);text-decoration:underline}
body.locked>*:not(dialog):not(script){visibility:hidden!important}
.foot{max-width:1100px;margin:0 auto 12px;padding:0 12px}
.foot-in{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.85rem}
.foot-in .lic{flex:1;min-width:200px}
.foot-in .lic.warn{color:var(--warn)}.foot-in .lic.bad{color:var(--bad)}
.foot-in .supLink{padding:8px 12px;font-size:.85rem}
.supLink.bad{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
@media print{#appFoot{display:none}}

/* ===== v1.5 — mobilni prikaz, delovi, izveštaji, logo ===== */
html{overflow-x:hidden;max-width:100%}
body{max-width:100vw;overflow-x:clip;touch-action:pan-y pinch-zoom}
.seg,.hscroll{touch-action:pan-x pan-y pinch-zoom}
.top-in{min-width:0}.logo{flex:none;font-size:.95rem}
#authBtn{flex:0 1 auto;min-width:0;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.grid>*,.row>*,.item>*,.stat,.card,.foot-in>*{min-width:0}
.card{overflow-x:auto}
.fld{min-width:0;max-width:100%}
.stat b{font-size:clamp(1rem,4.4vw,1.25rem);overflow-wrap:anywhere}
.item .grow{overflow-wrap:anywhere}
.item .amt{font-size:.9rem}
.card h3{flex-wrap:wrap}
.dlg{overflow-wrap:anywhere}
.irow{grid-template-columns:78px 66px minmax(0,1fr) auto}
.irow>*{min-width:0}
.irow .fld[data-k=qty]{width:100%!important}
.mrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 0;font-size:.85rem}
.mbar{height:10px;border-radius:6px;background:var(--card2);overflow:hidden}.mbar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.mval{text-align:right;white-space:nowrap}
.logoPrev{display:flex;align-items:center;justify-content:center;min-height:90px;border:1px dashed var(--line);border-radius:12px;background:#fff;margin-bottom:10px;padding:8px}
.logoPrev img{max-width:100%;max-height:80px;object-fit:contain}
.btn-v{background:#7360f2;border-color:#7360f2;color:#fff;font-weight:600}
.doc{max-width:100%}
.doc .hd{flex-wrap:wrap}
.doc .hl{display:flex;gap:12px;align-items:center;min-width:0}
.doc .dlogo{max-height:72px;max-width:170px;object-fit:contain}
.doc .sig{break-inside:avoid;page-break-inside:avoid}
.doc .sig div{min-height:18px}
@media(max-width:560px){
 .doc .hm{display:none}
 .doc h1{font-size:18px}
 .doc .items th,.doc .items td{padding:4px 3px;font-size:11px;width:auto!important}
 .doc .items th.q{width:38px!important}
 .doc .sig{gap:16px}
}

/* ===== v1.6 ===== */
.dtool{flex-wrap:wrap}
[data-act=gonalozi],.alert[data-tab]{cursor:pointer}
[data-act=gonalozi]:active{transform:scale(.98)}
@media print{
 html,body{overflow:visible!important;height:auto!important;max-width:none!important;width:auto!important}
 .doc{width:auto!important;font-size:12.5px;box-sizing:border-box}
 .doc table{max-width:100%}
 .doc tr,.doc .two>div,.doc .tot{break-inside:avoid;page-break-inside:avoid}
 .doc .items th{-webkit-print-color-adjust:exact;print-color-adjust:exact}

}
</style>
</head>
<body>
<div class="top"><div class="top-in"><div class="logo">ATMOS<b>RADIONICA</b></div><div class="shopname" id="shopName"></div><button class="btn-s" id="authBtn" type="button"></button></div></div>
<main class="shell" id="view"></main>
<div class="foot" id="appFoot"></div>
<button class="fab" id="fab" aria-label="Dodaj">+</button>
<nav id="nav">
  <button data-tab="pregled"><span>🏠</span>Pregled</button>
  <button data-tab="nalozi"><span>📋</span>Nalozi</button>
  <button data-tab="vozila"><span>🚗</span>Vozila</button>
  <button data-tab="podsetnici"><span>⏰</span>Podsetnici</button>
  <button data-tab="delovi" class="sec"><span>📦</span>Delovi</button>
  <button data-tab="mehanicari" class="sec"><span>🔧</span>Mehaničari</button>
  <button data-tab="izvestaji" class="sec"><span>📊</span>Izveštaji</button>
  <button data-tab="podesavanja" class="sec"><span>⚙️</span>Podešavanja</button>
  <button data-tab="vise" class="morebtn"><span>☰</span>Više</button>
</nav>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<dialog id="scanDlg"><div class="dlg" id="scanBody"></div></dialog>
<dialog id="authDlg"><div class="dlg" id="authBody"></div></dialog>
<div id="docView" hidden><div class="dtool"><button class="btn-p" data-act="print">🖨️ Štampaj</button><button class="btn-v" data-act="docshare">📤 Podeli PDF</button><button data-act="docclose">✕ Zatvori</button></div><div class="doc" id="docBody"></div></div>
<div class="upd" id="updBar" hidden><span class="grow">🔄 Dostupna je nova verzija aplikacije.</span><button data-act="updnow">Osveži</button></div>
<div class="toast" id="toast"></div>
<datalist id="vehList"></datalist><datalist id="itemList"></datalist>
<datalist id="remList"><option value="Redovni servis"><option value="Mali servis"><option value="Veliki servis"><option value="Zamena ulja i filtera"><option value="Zamena kaiša / lanca"><option value="Kočnice"><option value="Gume — sezonska zamena"><option value="Tehnički pregled"><option value="Registracija"><option value="Akumulator"><option value="Klima servis"></datalist>
<input type="file" id="impFile" accept=".json,.txt,application/json,text/plain" hidden>
<input type="file" id="scanFile" accept="image/*" hidden>
<input type="file" id="logoFile" accept="image/png,image/jpeg,image/webp" hidden>
<input type="file" id="scanCam" accept="image/*" capture="environment" hidden>

<script>
/* ---------- SAMO APLIKACIJA (APK / Windows) ----------
   Iz običnog pregledača i PWA prikazuje se ekran za preuzimanje aplikacije.
   Android APK otvara index.html?app=android, Windows program šalje „AtmosRadionicaApp“ u user-agent-u. */
(function(){
  var DL='https://github.com/gembirdt-bit/atmosradionica/releases/latest/download/';
  var q=new URLSearchParams(location.search),ua=navigator.userAgent||'',ref=document.referrer||'';
  var ok=/AtmosRadionicaApp|atmos-radionica\/[\d.]+ .*Electron\//.test(ua)||q.get('app')==='android'||ref.indexOf('android-app://io.github.gembirdt_bit.atmosradionica')===0||/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  try{if(ok)sessionStorage.setItem('atmosApp','1');else ok=sessionStorage.getItem('atmosApp')==='1'}catch(e){}
  if(ok)return;
  window.ATMOS_BLOCKED=true;
  var android=/Android/i.test(ua);
  var btn='display:block;box-sizing:border-box;width:100%;max-width:340px;margin:0 auto 12px;padding:14px 18px;border-radius:12px;font-size:16px;font-weight:600;text-decoration:none;text-align:center;cursor:pointer;border:0;';
  var main='background:#e9570b;color:#fff;',sec='background:#22262f;color:#e8eaf0;border:1px solid #343a46;';
  var aBtn='<a style="'+btn+(android?main:sec)+'" href="'+DL+'AtmosRadionica.apk">📱 Preuzmi za Android (APK)</a>';
  var wBtn='<a style="'+btn+(android?sec:main)+'" href="'+DL+'AtmosRadionica-Setup.exe">💻 Preuzmi za Windows</a>';
  document.body.className='';
  document.body.style.cssText='margin:0;padding:0;min-height:100vh;background:#111318;color:#e8eaf0;font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif';
  document.body.innerHTML='<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 20px;box-sizing:border-box">'
   +'<img src="icon-192.png" alt="" style="width:96px;height:96px;border-radius:22px;margin-bottom:18px">'
   +'<h1 style="font-size:24px;margin:0 0 8px">Atmos Radionica</h1>'
   +'<p style="margin:0 0 24px;color:#a3a8b8;max-width:440px">Aplikacija se koristi samo kao <b>Android aplikacija</b> ili <b>Windows program</b>. Preuzmi je, instaliraj i prijavi se istim korisničkim imenom i PIN-om.</p>'
   +(android?aBtn+wBtn:wBtn+aBtn)
   +'<p style="margin:4px 0 22px;font-size:13px;color:#7d8394;max-width:440px">Android: dozvoli instalaciju iz ovog izvora kad telefon pita. Windows: ako se pojavi „Windows je zaštitio računar“, klikni <i>Više informacija → Ipak pokreni</i>. Postoji i <a style="color:#a3a8b8" href="'+DL+'AtmosRadionica-Portable.exe">verzija bez instalacije</a>.</p>'
   +'<div style="border-top:1px solid #2a2f3a;padding-top:18px;max-width:440px;width:100%">'

  document.getElementById('gateExp').onclick=function(){

<script>
'use strict';
if(window.ATMOS_BLOCKED)throw new Error('Atmos Radionica: otvori Android ili Windows aplikaciju');
const VER='1.7.0';
let authState='locked'; /* locked = mora prijava; ok = licenca važi; expired = licenca istekla (samo pregled) */
let RO=true; /* režim samo za pregled dok se ne potvrdi prijava */
const $=id=>document.getElementById(id);
const KEY='atmosRadionica1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isNaN(n)?0:n};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>ymd(new Date());
const dayDiff=s=>Math.round((new Date(s+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/864e5);
function addM(s,n){const [y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1+n,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return ymd(new Date(t.getFullYear(),t.getMonth(),Math.min(d,last)))}
const fmtDate=s=>{if(!s)return'—';const p=String(s).split('-');return p.length===3?`${p[2]}.${p[1]}.${p[0]}.`:s};
const fmtN=(n,d)=>(Number(n)||0).toLocaleString('sr-RS',{maximumFractionDigits:d==null?0:d});
const money=n=>{const r=Math.round(num(n)*100)/100;return r.toLocaleString('sr-RS',{minimumFractionDigits:Number.isInteger(r)?0:2,maximumFractionDigits:2})+' RSD'};
const md=n=>(Math.round(num(n)*100)/100).toLocaleString('sr-RS',{minimumFractionDigits:2,maximumFractionDigits:2});
const MSL=['Januar','Februar','Mart','April','Maj','Jun','Jul','Avgust','Septembar','Oktobar','Novembar','Decembar'];
const MS=['Jan','Feb','Mar','Apr','Maj','Jun','Jul','Avg','Sep','Okt','Nov','Dec'];
const ST={uzet:{l:'Uzet u rad',c:'#38bdf8'},obrada:{l:'U obradi',c:'#f59e0b'},zavrsen:{l:'Završen',c:'#34d399'}};
const FUELS=['Benzin','Dizel','Benzin + TNG','Hibrid','Elektro','Ostalo'];
const RK={bad:3,warn:2,ok:1,n:0};
const worst=(a,b)=>RK[b]>RK[a]?b:a;
const statCls={bad:'b-bad',warn:'b-warn',ok:'b-ok',n:'b-n'};

/* ---------- PODACI ---------- */
const DEF_MSG='Poštovani {ime}, Vaše vozilo {tablica} ({vozilo}) je završeno i spremno za preuzimanje. Iznos: {iznos}.\n{radionica}{telefon}';
const DEF_SET=()=>({theme:'dark',accent:'#ea580c',fs:'m',shop:{name:'',addr:'',city:'',phone:'',email:'',pib:'',mb:'',acc:'',bank:''},pdvRate:0,pdvIncl:true,labourRate:0,warnDays:14,warnKm:1000,autoRem:true,remMonths:12,remKm:10000,valid:7,docNote:'',invNote:'',backupDays:7,snapKeep:7,lastExport:'',lastFolder:'',fbName:'',notif:false,lastNotif:'',logo:'',sig:true,autoNotify:true,cc:'381',msgDone:DEF_MSG,warranty:0});
const fresh=()=>({v:1,settings:DEF_SET(),mechs:[],vehicles:[],orders:[],reminders:[],parts:[],counters:{}});
function norm(d){const s=d.settings||{};d.settings=Object.assign(DEF_SET(),s);d.settings.shop=Object.assign(DEF_SET().shop,s.shop||{});['mechs','vehicles','orders','reminders','parts'].forEach(k=>d[k]=Array.isArray(d[k])?d[k]:[]);d.counters=d.counters||{};return d}
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&typeof r==='object')return norm(r)}catch{}return fresh()}
let db=load();
const S=()=>db.settings;
const hasData=()=>db.vehicles.length||db.orders.length||db.reminders.length||db.mechs.length||db.parts.length;
function persist(){if(RO)return true;try{localStorage.setItem(KEY,JSON.stringify(db));if(typeof syncSoon==='function')syncSoon();return true}catch{toast('Greška pri čuvanju (memorija puna?) — napravi izvoz!');return false}}
let bkT=null;
function save(){persist();updateBadge();clearTimeout(bkT);bkT=setTimeout(()=>{fbWrite().catch(()=>{})},15000)}
const vehById=id=>db.vehicles.find(v=>v.id===id);
const mechById=id=>db.mechs.find(m=>m.id===id);
const vehName=v=>[v.make,v.model].filter(Boolean).join(' ');
const vehLabel=v=>`${v.plate||'—'} — ${vehName(v)||'vozilo'}${v.owner?' — '+v.owner:''}`;
function nextNo(p){const y=new Date().getFullYear(),k=p+y;db.counters[k]=(db.counters[k]||0)+1;return `${p}-${y}-${String(db.counters[k]).padStart(4,'0')}`}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2800)}
function download(name,text,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function setPath(o,p,v){const k=p.split('.');let c=o;while(k.length>1)c=c[k.shift()];c[k[0]]=v}

/* ---------- IndexedDB: interne kopije + folder ---------- */
const idbOpen=()=>new Promise((res,rej)=>{const r=indexedDB.open('atmosRadionicaDB',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbGet(k){const d=await idbOpen();return new Promise((res,rej)=>{const q=d.transaction('h').objectStore('h').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbSet(k,v){const d=await idbOpen();return new Promise((res,rej)=>{const t=d.transaction('h','readwrite');t.objectStore('h').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function idbDel(k){const d=await idbOpen();return new Promise((res,rej)=>{const t=d.transaction('h','readwrite');t.objectStore('h').delete(k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
let snaps=[];
async function loadSnaps(){try{snaps=(await idbGet('snaps'))||[]}catch{snaps=[]}}
async function takeSnap(reason,force){
  try{if(!hasData())return;const data=JSON.stringify(db);await loadSnaps();const day=todayStr();if(!force&&snaps.length&&snaps[0].day===day)return;
    snaps.unshift({t:new Date().toISOString(),day,reason:reason||'automatski',data});const keep=Math.max(1,Math.min(30,num(S().snapKeep)||7));while(snaps.length>keep)snaps.pop();await idbSet('snaps',snaps)}catch{}
}
async function restoreSnap(i){if(RO){roBlock();return}const s=snaps[i];if(!s)return;
  if(!confirm('Vratiti podatke iz kopije od '+new Date(s.t).toLocaleString('sr-RS')+'? Trenutno stanje se prvo sačuva.'))return;
  const data=s.data;await takeSnap('pre-vraćanja',true);db=norm(JSON.parse(data));persist();render();toast('Podaci vraćeni ✔')}

/* folder backup (File System Access API — Chrome/Edge na računaru) */
const fbSupported=()=>'showDirectoryPicker' in window;
let fbNeedPerm=false;
async function fbWrite(manual){
  const h=await idbGet('fbDir').catch(()=>null);if(!h)return false;
  let p=await h.queryPermission({mode:'readwrite'});
  if(p!=='granted'){fbNeedPerm=true;if(ui.tab==='podesavanja'||ui.tab==='pregled')render();return false}
  fbNeedPerm=false;
  const f=await h.getFileHandle(`atmos-radionica-backup-${todayStr()}.json`,{create:true});
  const w=await f.createWritable();await w.write(JSON.stringify(db));await w.close();
  S().lastFolder=new Date().toISOString();persist();
  try{const names=[];for await(const [n] of h.entries()){if(/^atmos-radionica-backup-\d{4}-\d{2}-\d{2}\.json$/.test(n))names.push(n)}names.sort();const keep=Math.max(3,num(S().snapKeep)*2);while(names.length>keep)await h.removeEntry(names.shift())}catch{}
  if(manual)toast('Backup upisan u folder ✔');if(ui.tab==='podesavanja')render();return true;
}
async function fbPick(){try{const h=await showDirectoryPicker({mode:'readwrite',id:'atmos-radionica'});await idbSet('fbDir',h);S().fbName=h.name;persist();await fbWrite(true)}catch(e){if(e&&e.name!=='AbortError')toast('Folder nije izabran')}render()}
async function fbAllow(){try{const h=await idbGet('fbDir');const p=await h.requestPermission({mode:'readwrite'});if(p==='granted'){await fbWrite(true)}}catch{toast('Dozvola nije data')}render()}
async function fbClear(){await idbDel('fbDir').catch(()=>{});S().fbName='';S().lastFolder='';fbNeedPerm=false;persist();render()}
function backupDue(){const n=num(S().backupDays);if(!n||!hasData())return false;const last=[S().lastExport,(S().lastFolder||'').slice(0,10)].filter(Boolean).sort().pop();return !last||-dayDiff(last)>=n}

/* ---------- STATUSI / PODSETNICI ---------- */
function remStat(r){
  let lvl='n';const parts=[];
  if(r.dueDate){const d=dayDiff(r.dueDate),l=d<0?'bad':d<=num(S().warnDays)?'warn':'ok';parts.push(d<0?`kasni ${-d} d`:d===0?'danas':`za ${d} d`);lvl=worst(lvl,l)}
  const v=vehById(r.vehicleId);
  if(r.dueKm&&v&&num(v.km)){const rem=num(r.dueKm)-num(v.km),l=rem<0?'bad':rem<=num(S().warnKm)?'warn':'ok';parts.push(rem<0?`prešao ${fmtN(-rem)} km`:`još ${fmtN(rem)} km`);lvl=worst(lvl,l)}
  else if(r.dueKm)parts.push('na '+fmtN(r.dueKm)+' km');
  return{lvl,badge:parts.join(' · ')||'Bez roka'};
}
const alerts=()=>db.reminders.filter(r=>!r.done).map(r=>({r,s:remStat(r)})).filter(x=>x.s.lvl==='bad'||x.s.lvl==='warn').sort((a,b)=>RK[b.s.lvl]-RK[a.s.lvl]);
function updateBadge(){try{if(!navigator.setAppBadge)return;const n=alerts().length;n?navigator.setAppBadge(n):navigator.clearAppBadge()}catch{}}
function remMsg(r){const v=vehById(r.vehicleId)||{},sh=S().shop;const due=[r.dueDate?'do '+fmtDate(r.dueDate):'',r.dueKm?'na '+fmtN(r.dueKm)+' km':''].filter(Boolean).join(' / ');
  return `Poštovani${v.owner?' '+v.owner:''}, podsećamo Vas da je za vozilo ${v.plate||''}${vehName(v)?' ('+vehName(v)+')':''} vreme za: ${r.title}${due?' ('+due+')':''}. ${sh.name||''}${sh.phone?', tel. '+sh.phone:''}`.replace(/\s+/g,' ').trim()}
function ensureReminder(o){
  const v=vehById(o.vehicleId);if(!v)return;
  const auto=S().autoRem;if(!auto&&!o.nextDate&&!o.nextKm)return;
  const nd=o.nextDate||(auto&&num(S().remMonths)?addM(todayStr(),Math.round(num(S().remMonths))):'');
  const nk=o.nextKm||(auto&&num(S().remKm)&&num(o.km||v.km)?num(o.km||v.km)+num(S().remKm):'');
  if(!nd&&!nk)return;
  db.reminders.forEach(r=>{if(!r.done&&r.vehicleId===o.vehicleId&&r.title==='Redovni servis'&&r.id!==o.remId)r.done=true});
  let r=db.reminders.find(x=>x.id===o.remId);
  if(r){r.dueDate=nd;r.dueKm=nk;r.done=false}
  else{r={id:uid(),vehicleId:o.vehicleId,title:'Redovni servis',dueDate:nd,dueKm:nk,repMonths:num(S().remMonths)||'',repKm:num(S().remKm)||'',done:false,note:'Automatski posle naloga '+o.no};db.reminders.push(r);o.remId=r.id}
}

/* ---------- OBRAČUN ---------- */
function calc(o){
  let lab=0,part=0;(o.items||[]).forEach(i=>{const a=num(i.qty)*num(i.price);if(i.type==='deo')part+=a;else lab+=a});
  const sub=lab+part,disc=sub*num(o.discount)/100,after=sub-disc,r=num(S().pdvRate)/100;
  let base=after,pdv=0,total=after;
  if(r>0){if(S().pdvIncl){base=after/(1+r);pdv=after-base}else{pdv=after*r;total=after+pdv}}
  return{lab,part,sub,disc,after,base,pdv,total,r};
}
function totHtml(t){const row=(l,v,b)=>`<div class="row sp" style="padding:3px 0;${b?'font-weight:800;font-size:1.1rem;border-top:1px solid var(--line);margin-top:4px;padding-top:6px':''}"><span class="${b?'':'muted'}">${l}</span><span>${v}</span></div>`;
  return row('Rad',money(t.lab))+row('Delovi',money(t.part))+(t.disc?row('Popust',' − '+money(t.disc)):'')+(t.r>0?row('Osnovica',money(t.base))+row('PDV '+Math.round(t.r*100)+'%',money(t.pdv)):'')+row('UKUPNO',money(t.total),1)}

/* ---------- UI STANJE ---------- */
const ui={tab:'pregled',q:'',st:'all',mech:'',rp:'m',rmon:todayStr().slice(0,7),ry:String(new Date().getFullYear()),remTab:'act',pst:'all'};
const SEC=['vise','delovi','mehanicari','izvestaji','podesavanja'];
const ACCS=['#ea580c','#2563eb','#16a34a','#dc2626','#7c3aed','#0891b2','#475569'];
function applyTheme(){const s=S();document.documentElement.dataset.theme=s.theme==='auto'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):s.theme;
  document.documentElement.style.setProperty('--acc',s.accent);document.body.className=(s.fs==='l'?'fs-l':s.fs==='s'?'fs-s':'')+(RO?' ro':'')+(authState==='locked'?' locked':'');
  document.querySelector('meta[name=theme-color]').content=document.documentElement.dataset.theme==='light'?'#f3f4f6':'#111318'}
function go(t){ui.tab=t;ui.q='';render();window.scrollTo(0,0)}
function render(){
  applyTheme();
  $('shopName').textContent=S().shop.name||'';
  $('vehList').innerHTML=db.vehicles.map(v=>`<option value="${esc(vehLabel(v))}">`).join('');
  const names=new Set();db.orders.forEach(o=>(o.items||[]).forEach(i=>i.name&&names.add(i.name)));$('itemList').innerHTML=[...names].slice(-300).map(n=>`<option value="${esc(n)}">`).join('');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===ui.tab||(b.dataset.tab==='vise'&&SEC.includes(ui.tab)&&innerWidth<900)));
  $('fab').style.display=['pregled','nalozi','vozila','podsetnici','delovi','mehanicari'].includes(ui.tab)&&!RO?'block':'none';
  updateBadge();
  const P={pregled:pgPregled,nalozi:pgNalozi,vozila:pgVozila,podsetnici:pgPodsetnici,delovi:pgDelovi,mehanicari:pgMeh,izvestaji:pgIzvestaji,vise:pgVise,podesavanja:pgPodesavanja};
  $('view').innerHTML=P[ui.tab]();
}
const stBadge=s=>{const x=ST[s]||ST.uzet;return`<span class="badge" style="background:${x.c}26;color:${x.c}">${x.l}</span>`};

/* ---------- STRANICE ---------- */
function remItem(x,withActs){const r=x.r||x,s=x.s||remStat(r),v=vehById(r.vehicleId)||{};
  return`<div class="item ${r.done?'dim':''}"><div class="grow"><div class="row sp"><div><span class="plate">${esc(v.plate||'—')}</span> <b>${esc(r.title)}</b></div></div>
  <div class="small muted">${esc(vehName(v))}${v.owner?' · '+esc(v.owner):''}${v.phone?' · '+esc(v.phone):''}</div>
  <div class="small muted">${r.dueDate?'Rok: '+fmtDate(r.dueDate):''}${r.dueDate&&r.dueKm?' · ':''}${r.dueKm?'Km: '+fmtN(r.dueKm):''}${v.km?' (trenutno '+fmtN(v.km)+' km)':''}</div>
  <div class="row wrap" style="gap:8px;margin-top:4px">${r.done?'<span class="badge b-n">Urađeno</span>':`<span class="badge ${statCls[s.lvl]}">${esc(s.badge)}</span>`}${(r.repMonths||r.repKm)?'<span class="badge b-n">🔁 ponavlja se</span>':''}</div>
  ${r.note?`<div class="small muted" style="margin-top:4px">${esc(r.note)}</div>`:''}
  ${withActs?`<div class="acts">${r.done?`<button class="btn-s" data-act="remundo" data-id="${r.id}">↩ Vrati</button>`:`<button class="btn-s btn-p" data-act="remdone" data-id="${r.id}">✔ Urađeno</button>${v.phone?`<button class="btn-s" data-act="remsms" data-id="${r.id}">📩 SMS</button>`:''}<button class="btn-s" data-act="remshare" data-id="${r.id}">📤</button><button class="btn-s" data-act="neword" data-veh="${v.id||''}">📋 Nalog</button>`}<button class="btn-s" data-act="editrem" data-id="${r.id}">✏️</button><button class="btn-s btn-d" data-act="delrem" data-id="${r.id}">🗑️</button></div>`:''}</div></div>`}
function orderCard(o){
  const v=vehById(o.vehicleId)||{},m=mechById(o.mechId),t=calc(o);
  const next=o.status==='uzet'?['obrada','▶ U obradi']:o.status==='obrada'?['zavrsen','✔ Završi']:null;
  return`<div class="item"><div class="grow"><div class="row sp"><div><span class="plate">${esc(v.plate||'—')}</span> <b>${esc(vehName(v))}</b></div><div class="amt">${money(t.total)}</div></div>
  <div class="small muted">${esc(o.no)} · ${fmtDate(o.date)}${v.owner?' · '+esc(v.owner):''}${m?' · 🔧 '+esc(m.name):''}${o.km?' · '+fmtN(o.km)+' km':''}</div>
  <div class="row wrap" style="gap:8px;margin-top:4px">${stBadge(o.status)}${o.paid?'<span class="badge b-ok">Plaćeno</span>':(o.status==='zavrsen'?'<span class="badge b-warn">Za naplatu</span>':'')}${o.invNo?`<span class="badge b-n">${esc(o.invNo)}</span>`:o.proNo?`<span class="badge b-n">${esc(o.proNo)}</span>`:''}${o.notified?`<span class="badge b-ok">💬 Obavešten</span>`:''}${o.status!=='zavrsen'?(()=>{let h='';if(o.promised){const d=dayDiff(o.promised);h+=`<span class="badge ${d<0?'b-bad':d<=1?'b-warn':'b-n'}">⏱ Rok ${fmtDate(o.promised)}${d<0?' · kasni':d===0?' · danas':''}</span>`}const dd=-dayDiff(o.date);if(dd>0)h+=`<span class="badge b-n">${dd} d u radionici</span>`;return h})():''}</div>
  ${o.complaint?`<div class="small" style="margin-top:4px">${esc(o.complaint)}</div>`:''}
  <div class="acts">${next?`<button class="btn-s btn-p" data-act="stnext" data-id="${o.id}" data-st="${next[0]}">${next[1]}</button>`:(!o.paid?`<button class="btn-s btn-p" data-act="paid" data-id="${o.id}">💳 Naplaćeno</button>`:'')}${o.status==='zavrsen'?`<button class="btn-s btn-v" data-act="notify" data-id="${o.id}">💬 Obavesti</button>`:''}<button class="btn-s" data-act="editord" data-id="${o.id}">✏️ Izmeni</button><button class="btn-s" data-act="pickdoc" data-id="${o.id}">🖨️ Štampa</button>${v.phone?`<a class="supLink" style="padding:6px 10px;font-size:.8rem;border-radius:10px" href="tel:${esc(v.phone.replace(/[^\d+]/g,''))}">📞 Pozovi</a>`:''}<button class="btn-s btn-d" data-act="delord" data-id="${o.id}">🗑️</button></div></div></div>`}
function backupBanner(){return backupDue()?`<div class="card" style="border-color:var(--warn)"><h3>💾 Vreme je za rezervnu kopiju</h3><div class="row wrap"><button class="btn-p grow" data-act="sharefile">☁️ Podeli / sačuvaj</button><button class="grow" data-act="export">⬇ Preuzmi</button></div></div>`:''}
function fbBanner(){return fbNeedPerm?`<div class="card" style="border-color:var(--warn)"><h3>📁 Backup u folder čeka dozvolu</h3><button class="btn-p" data-act="fballow" style="width:100%">Dozvoli upis backup-a</button></div>`:''}
function pgPregled(){
  const act=db.orders.filter(o=>o.status!=='zavrsen'),n=s=>db.orders.filter(o=>o.status===s).length;

function repData(){
  const now=new Date(),cy=now.getFullYear(),M=ui.rp;
  let from,to='9999-12-31',lbl='';
  if(M==='m'){const [y,mo]=ui.rmon.split('-').map(Number);from=ui.rmon+'-01';to=ui.rmon+'-31';lbl=MSL[mo-1]+' '+y+'.'}
  else if(M==='y'){from=ui.ry+'-01-01';to=ui.ry+'-12-31';lbl=ui.ry+'. godina'}
  else{const N=+M||3;from=ymd(new Date(now.getFullYear(),now.getMonth()-(N-1),1));lbl='Poslednjih '+N+' meseca (od '+fmtDate(from)+')'}
  const dd=o=>o.doneDate||o.date||'';
  const l=db.orders.filter(o=>o.status==='zavrsen'&&dd(o)>=from&&dd(o)<=to).sort((a,b)=>dd(b).localeCompare(dd(a)));
  const tot=l.reduce((a,o)=>{const t=calc(o);a.lab+=t.lab*(1-num(o.discount)/100);a.part+=t.part*(1-num(o.discount)/100);a.total+=t.total;if(o.paid)a.paid+=t.total;return a},{lab:0,part:0,total:0,paid:0});
  const byM={};l.forEach(o=>{const k=dd(o).slice(0,7);byM[k]=byM[k]||{n:0,t:0};byM[k].n++;byM[k].t+=calc(o).total});
  const byMech={};l.forEach(o=>{const k=o.mechId||'-';byMech[k]=byMech[k]||{n:0,t:0};byMech[k].n++;byMech[k].t+=calc(o).total});
  const keys=M==='y'?Array.from({length:12},(_,i)=>ui.ry+'-'+pad(i+1)):Object.keys(byM).sort().reverse();
  const mx=Math.max(1,...keys.map(k=>byM[k]?byM[k].t:0));
  const mcount=ui.ry===String(cy)?now.getMonth()+1:12;
  return{now,cy,M,from,to,lbl,dd,l,tot,byM,byMech,keys,mx,mcount};
}

function pdfFromJpegs(pages){
  const enc=new TextEncoder(),parts=[],xref=[];let off=0;
  const push=b=>{const u=typeof b==='string'?enc.encode(b):b;parts.push(u);off+=u.length};
  const n=pages.length,PW=595.28,PH=841.89;
  push('%PDF-1.4\n');
  xref[1]=off;push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  xref[2]=off;push('2 0 obj\n<< /Type /Pages /Kids ['+pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] /Count '+n+' >>\nendobj\n');
  pages.forEach((pg,i)=>{
    const P=3+i*3,C=P+1,I=P+2,content=`q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
    xref[P]=off;push(`${P} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${I} 0 R >> >> /Contents ${C} 0 R >>\nendobj\n`);
    xref[C]=off;push(`${C} 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
    xref[I]=off;push(`${I} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${pg.w} /Height ${pg.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.bytes.length} >>\nstream\n`);push(pg.bytes);push('\nendstream\nendobj\n');
  });
  const total=3+n*3,xo=off;
  push('xref\n0 '+total+'\n0000000000 65535 f \n'+xref.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join(''));
  push('trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xo+'\n%%EOF');
  const out=new Uint8Array(off);let p=0;parts.forEach(u=>{out.set(u,p);p+=u.length});return out;
}
async function renderDocPages(){
  const W=703,MM=12,PWpx=794,PHpx=1123,MG=Math.round(MM/25.4*96),PAGE=PHpx-2*MG,SC=2;
  let css='';for(const sh of document.styleSheets){try{for(const r of sh.cssRules){if(r.type===1&&/\.doc\b|\.plate/.test(r.selectorText||''))css+=r.cssText}}catch{}}
  css+='.small{font-size:.8rem}.muted{color:#666}.doc{padding:0!important;margin:0!important;box-shadow:none!important;max-width:none!important;width:'+W+'px!important;box-sizing:border-box}';
  const inner='<style>'+css+'</style><div class="doc">'+$('docBody').innerHTML+'</div>';
  /* merenje u izolovanom iframe-u (isti kontekst kao pri crtanju u slici) */
  const host=document.createElement('iframe');host.style.cssText='position:fixed;left:-10000px;top:0;width:'+W+'px;height:4000px;border:0';
  host.srcdoc='<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}</style></head><body>'+inner+'</body></html>';
  document.body.appendChild(host);await new Promise(r=>{host.onload=r});
  try{
    const doc=host.contentDocument,d=doc.querySelector('.doc');await new Promise(r=>setTimeout(r,80));
    const imgs=[...d.querySelectorAll('img')];await Promise.all(imgs.map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
    const H=Math.ceil(d.getBoundingClientRect().height),top0=d.getBoundingClientRect().top,tops=[];
    [...d.children].forEach(c=>{if(!(c.previousElementSibling&&c.previousElementSibling.tagName==='H2'))tops.push(Math.round(c.getBoundingClientRect().top-top0))});
    d.querySelectorAll('.items').forEach(t=>{[...t.querySelectorAll('tr')].forEach((tr,i)=>{if(i>1)tops.push(Math.round(tr.getBoundingClientRect().top-top0))})});
    tops.sort((a,b)=>a-b);
    const br=[];let st=0;while(H-st>PAGE){const lim=st+PAGE;let b=-1;for(const t of tops)if(t>st+60&&t<=lim)b=t;if(b<0)b=lim;br.push([st,b]);st=b}br.push([st,H]);
    const wrap=document.createElement('div');wrap.style.cssText='width:'+W+'px;background:#fff';wrap.innerHTML=inner;
    const ser=new XMLSerializer().serializeToString(wrap);
    const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'"><foreignObject x="0" y="0" width="100%" height="100%">'+ser+'</foreignObject></svg>';
    const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('svg'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
    const full=document.createElement('canvas');full.width=W*SC;full.height=H*SC;const fc=full.getContext('2d');fc.fillStyle='#fff';fc.fillRect(0,0,full.width,full.height);fc.drawImage(img,0,0,W*SC,H*SC);
    const out=[];
    for(const [a,b] of br){
      const cv=document.createElement('canvas');cv.width=PWpx*SC;cv.height=PHpx*SC;const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);
      c.drawImage(full,0,a*SC,W*SC,(b-a)*SC,MG*SC,MG*SC,W*SC,(b-a)*SC);
      const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.92));
      out.push({bytes:new Uint8Array(await blob.arrayBuffer()),w:cv.width,h:cv.height});
    }
    return out;
  }finally{host.remove()}
}
async function docPdf(){
  const name=(docCtx.name||'dokument').replace(/[^\w\-]+/g,'_')+'.pdf';
  try{
    if(!docCtx.pdf){toast('Pravim PDF…');docCtx.pdf=new File([pdfFromJpegs(await renderDocPages())],name,{type:'application/pdf'})}
    const f=docCtx.pdf;
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return}catch(e){if(e&&e.name==='AbortError')return;toast('Pritisni „Podeli PDF“ još jednom');return}}
    const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('PDF preuzet ✔');
  }catch(e){docCtx.pdf=null;toast('PDF nije uspeo — koristi „Štampaj“ i sačuvaj kao PDF')}
}

  $('dlgBody').innerHTML=`<form id="gf"><h3>${cfg.title}</h3>${cfg.pre||''}<div class="grid g2" style="gap:10px">${cfg.fields.map(fld).join('')}</div><div class="row" style="margin-top:14px"><button type="button" class="grow" data-act="dlgclose">Otkaži</button><button class="btn-p grow">💾 Sačuvaj</button></div></form>`;

}
document.addEventListener('submit',e=>{

const WMI={WVW:'Volkswagen',WV1:'Volkswagen',WV2:'Volkswagen',VWV:'Volkswagen',WAU:'Audi',TRU:'Audi',WBA:'BMW',WBS:'BMW',WDB:'Mercedes-Benz',WDD:'Mercedes-Benz',WDC:'Mercedes-Benz',W0L:'Opel',WF0:'Ford',VF1:'Renault',VF3:'Peugeot',VF7:'Citroën',ZFA:'Fiat',ZAR:'Alfa Romeo',TMB:'Škoda',UU1:'Dacia',VSS:'Seat',KMH:'Hyundai',KNA:'Kia',KND:'Kia',JTD:'Toyota',YV1:'Volvo',WP0:'Porsche',SAL:'Land Rover',ZCF:'Iveco',VNK:'Toyota',SJN:'Nissan',JMZ:'Mazda',JHM:'Honda',TSM:'Suzuki'};
const vinOK=v=>/^[A-HJ-NPR-Z0-9]{17}$/.test(v);
function vinHint(el){el.value=el.value.toUpperCase().replace(/\s/g,'');const v=el.value,h=$('vinHint');if(!h)return;
  if(!v){h.textContent='';return}
  const mk=WMI[v.slice(0,3)];
  h.innerHTML=vinOK(v)?`<span style="color:var(--ok)">✔ ispravan format (17 znakova)${mk?' · '+mk:''}</span>`:`<span style="color:var(--warn)">⚠ ${v.length}/17 znakova${/[IOQ]/.test(v)?' · I, O i Q se ne koriste u VIN-u':''}</span>`;
  const mkI=$('gf').elements.make;if(mk&&mkI&&!mkI.value&&vinOK(v))mkI.value=mk}

/* ---------- OCR SAOBRAĆAJNE DOZVOLE ---------- */
const CYR={А:'A',Б:'B',В:'V',Г:'G',Д:'D',Ђ:'Đ',Е:'E',Ж:'Ž',З:'Z',И:'I',Ј:'J',К:'K',Л:'L',Љ:'Lj',М:'M',Н:'N',Њ:'Nj',О:'O',П:'P',Р:'R',С:'S',Т:'T',Ћ:'Ć',У:'U',Ф:'F',Х:'H',Ц:'C',Ч:'Č',Џ:'Dž',Ш:'Š',а:'a',б:'b',в:'v',г:'g',д:'d',ђ:'đ',е:'e',ж:'ž',з:'z',и:'i',ј:'j',к:'k',л:'l',љ:'lj',м:'m',н:'n',њ:'nj',о:'o',п:'p',р:'r',с:'s',т:'t',ћ:'ć',у:'u',ф:'f',х:'h',ц:'c',ч:'č',џ:'dž',ш:'š'};
const translit=s=>String(s||'').replace(/[Ѐ-ӿ]/g,c=>CYR[c]!==undefined?CYR[c]:c);
const MAKES=['VOLKSWAGEN','VW','OPEL','FORD','RENAULT','PEUGEOT','CITROEN','CITROËN','FIAT','ZASTAVA','CRVENA ZASTAVA','SKODA','ŠKODA','AUDI','BMW','MERCEDES-BENZ','MERCEDES','TOYOTA','HYUNDAI','KIA','DACIA','SEAT','NISSAN','MAZDA','HONDA','SUZUKI','CHEVROLET','VOLVO','ALFA ROMEO','MITSUBISHI','YUGO','LANCIA','CHRYSLER','JEEP','LAND ROVER','MINI','SMART','SUBARU','PORSCHE','IVECO','DAEWOO','LADA','TOYOTA'];
const MAKE_NAME={VW:'Volkswagen','CRVENA ZASTAVA':'Zastava','MERCEDES-BENZ':'Mercedes-Benz',CITROEN:'Citroën',SKODA:'Škoda'};
const titleCase=s=>String(s||'').toLowerCase().replace(/(^|[\s\-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
function parseReg(raw){
  const txt=translit(raw).toUpperCase().replace(/[|_]/g,' ');
  const L=txt.split('\n').map(l=>l.replace(/[ \t]+/g,' ').trim()).filter(Boolean);
  const r={};
  /* VIN */
  const fixV=s=>s.replace(/[OQ]/g,'0').replace(/I/g,'1');
  const isV=s=>/^[A-HJ-NPR-Z0-9]{17}$/.test(s)&&/\d/.test(s)&&/[A-Z]/.test(s);
  const digits=s=>(s.match(/\d/g)||[]).length;
  outer:for(const joined of [false,true]){for(const l of L){const tk=l.split(' ');for(let i=0;i<tk.length;i++){let c='';for(let j=i;j<tk.length&&c.length<=17&&(joined||j===i);j++){c+=tk[j].replace(/[^A-Z0-9]/g,'');if(c.length===17&&digits(c)>=4){const f=fixV(c);if(isV(f)){r.vin=f;break outer}}}}}}
  /* tablica */
  const pm=/(?:^|[^A-Z0-9])([A-ZŠĐČĆŽ]{2})\s?[-–.]?\s?(\d{3,4})\s?[-–.]?\s?([A-ZŠĐČĆŽ]{2})(?![A-Z0-9])/;
  for(const l of L){if(r.vin&&l.replace(/[^A-Z0-9]/g,'').includes(r.vin))continue;const m=pm.exec(l);if(m){r.plate=`${m[1]} ${m[2]}-${m[3]}`;break}}
  /* pomoćne */
  const STOP=/^(MARKA|MAKE|TIP|VARIJANTA|VERZIJA|KOMERCIJALNA|OZNAKA|TRADE|NAME|PREZIME|NAZIV|IME|SURNAME|ADRESA|ADDRESS|SNAGA|ZAPREMINA|MOTORA|ENGINE|CAPACITY|POWER|GORIVO|FUEL|[\/\-:.,)])\s*/;
  const clean=s=>{s=String(s||'').trim();let p;do{p=s;s=s.replace(STOP,'')}while(s!==p);return s.trim()};
  const lab=(c,n)=>new RegExp('(?:^|\\s)\\(?'+c+'\\.?\\s?'+n+'\\)?[.:]?(?=\\s|$)');
  const after=re=>{for(let i=0;i<L.length;i++){const m=re.exec(L[i]);if(m){let rest=clean(L[i].slice(m.index+m[0].length));if(rest.length<2&&L[i+1])rest=clean(L[i+1]);return rest}}return''};
  /* kubikaža */
  let m=/(\d{3,4})\s?(?:CM3|CM³|CM\s?3|CCM|CM\b)/.exec(txt);let ccm=m?+m[1]:0;
  if(!ccm){const s=after(lab('P','1'));const mm=/\b(\d{3,4})\b/.exec(s);if(mm)ccm=+mm[1]}
  if(ccm>=600&&ccm<=9000)r.ccm=ccm;
  /* snaga */
  m=/(\d{2,3})(?:[.,]\d+)?\s?KW/.exec(txt);let kw=m?+m[1]:0;
  if(!kw){const s=after(lab('P','2'));const mm=/\b(\d{2,3})\b/.exec(s);if(mm)kw=+mm[1]}
  if(kw>=15&&kw<=600)r.kw=kw;
  /* gorivo */
  if(/DIZEL|DIESEL/.test(txt))r.fuel='Dizel';else if(/ELEKTR/.test(txt)&&!/BENZIN/.test(txt))r.fuel='Elektro';else if(/HIBRID|HYBRID/.test(txt))r.fuel='Hibrid';else if(/BENZIN|PETROL|GASOLINE/.test(txt))r.fuel=/TNG|LPG|AUTOGAS/.test(txt)?'Benzin + TNG':'Benzin';
  /* godina proizvodnje */
  for(let i=0;i<L.length;i++){if(/PROIZVOD|MANUFACT/.test(L[i])){const mm=/\b(19[5-9]\d|20[0-3]\d)\b/.exec(L[i]+' '+(L[i+1]||''));if(mm){r.year=+mm[1];break}}}
  /* marka */
  let mk=after(lab('D','1'));
  const known=MAKES.find(k=>new RegExp('(?:^|[^A-ZŠČĆŽĐ])'+k.replace(/[-]/g,'\\-')+'(?![A-ZŠČĆŽĐ])').test(txt));
  if(known)mk=known;else if(mk)mk=mk.split(' ')[0];

      body:JSON.stringify({a:'sync',user:s.u,pin:s.p,device:deviceId(),dname:deviceName(),since:sy.rev,changes,counters:authState==='ok'?db.counters:{}})});
    if(!r.ok)throw new Error('http '+r.status);
    const j=await r.json();
    if(j.status==='limit'){clearAuth();lock(limitMsg(j));return}
    if(j.status==='blocked'){clearAuth();lock(blockedMsg);return}
    if(j.status==='invalid'){clearAuth();lock('PIN više nije važeći. Prijavi se ponovo.');return}
    if(j.status!=='ok'&&j.status!=='expired'||j.rev==null){syMsg=j.v&&j.v!=='sync-1'?'Server još nema sinhronizaciju (Code.gs)':'Greška servera';sy.err=syMsg;syStore();return}
    if(j.maxDevices!=null)authDev={n:Number(j.devices)||0,max:Number(j.maxDevices)};
    /* poslato je sada na serveru */
    Object.keys(sent).forEach(k=>{if(sent[k]===null)delete sy.h[k];else sy.h[k]=sent[k]});
    /* primeni tuđe izmene; preskoči zapise koje je korisnik menjao dok je zahtev trajao */
    const now=syLocal();let got=0;
    Object.keys(j.changes||{}).forEach(k=>{
      const cur=now[k]?syHash(now[k]):null;
      if(cur!==(k in sy.h?sy.h[k]:null))return;           /* lokalna izmena u toku → ostaje, šalje se sledeći put */
      const v=j.changes[k];
      if(k==='_set'){if(v){const keep={};LOCAL_SET.forEach(x=>{if(x in S())keep[x]=S()[x]});const ns=Object.assign(DEF_SET(),v,keep);ns.shop=Object.assign(DEF_SET().shop,v.shop||{});if(syHash(sySharedSet())!==syHash(Object.fromEntries(Object.keys(ns).filter(x=>!LOCAL_SET.includes(x)).map(x=>[x,ns[x]])))){db.settings=ns;got++}sy.h[k]=syHash(sySharedSet())}return}
      const [c,id]=k.split('/');if(!SYNC_COLLS.includes(c))return;
      const i=db[c].findIndex(x=>x.id===id);
      if(v){if(i>=0)db[c][i]=v;else db[c].push(v);sy.h[k]=syHash(v)}
      else{if(i>=0)db[c].splice(i,1);delete sy.h[k]}
      got++;
    });
    Object.keys(j.counters||{}).forEach(k=>{const n=Number(j.counters[k])||0;if(n>(db.counters[k]||0)){db.counters[k]=n;got++}});
    sy.rev=j.rev;sy.last=Date.now();sy.err='';sy.user=s.u.toLowerCase();syStore();
    if(got){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}updateBadge();if(!document.querySelector('dialog[open]')&&$('docView').hidden)render()}
    syMsg='';if(manual)toast(got?'Sinhronizovano ✔ — stiglo izmena: '+got:'Sinhronizovano ✔');
    if(ui.tab==='podesavanja'&&!got)render();
  }catch(e){syMsg='Nema veze sa serverom — pokušaću ponovo';sy.err=syMsg;syStore();if(manual)toast(syMsg)}
  finally{syBusy=false}
}
function syncStart(){
  setInterval(()=>syncNow(),SYNC_MIN*60*1000);
  addEventListener('online',()=>syncSoon(2000));
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-sy.last>60000)syncSoon(1500)});
}
function syncCard(){
  const t=sy.last?new Date(sy.last).toLocaleString('sr-RS',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'nikad';
  const st=!syOn()?'Isključena na ovom uređaju':syBusy?'Sinhronizacija…':syMsg||sy.err||'✔ Radi';
  const bad=syOn()&&(syMsg||sy.err)&&!syBusy;
  return`<div class="card"><h3>🔄 Sinhronizacija između uređaja</h3>
   <div class="small muted" style="margin-bottom:8px">Svi uređaji prijavljeni na nalog <b>${esc(authUser)}</b> dele iste naloge, vozila, podsetnike, delove, mehaničare i podatke radionice. Izmene se šalju par sekundi posle čuvanja i na svakih ${SYNC_MIN} minuta.</div>
   <div class="row sp" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="muted">Stanje</span><b style="${bad?'color:var(--warn)':''}">${esc(st)}</b></div>
   <div class="row sp" style="padding:6px 0;border-bottom:1px solid var(--line);margin-bottom:10px"><span class="muted">Poslednja sinhronizacija</span><b>${esc(t)}</b></div>
   <div class="row wrap" style="gap:8px"><button class="btn-p grow" data-act="syncnow" ${syOn()?'':'disabled'}>🔄 Sinhronizuj sada</button><button class="grow" data-act="synctoggle">${syOn()?'⏸ Isključi':'▶ Uključi'}</button></div></div>`;
}
function authStart(){
  $('authBtn').onclick=()=>{if(confirm('Odjaviti se? Za ponovni ulaz biće potrebni korisničko ime i PIN.')){clearAuth();lock()}};
  const s=loadAuth();if(s&&s.dev)authDev=s.dev;
  if(s&&freshAuth(s)){setAuth(stateOf(s),s.u,daysLeft(s),s.exp);authRecheck()}
  else lock(s?'Prijava je istekla — poveži se na internet i prijavi se ponovo.':'');
  setInterval(authRecheck,RECHECK_MIN*60*1000);
  syncStart();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)authRecheck()});
}

/* ---------- START ---------- */
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',()=>S().theme==='auto'&&applyTheme());
addEventListener('resize',()=>{clearTimeout(addEventListener.t);addEventListener.t=setTimeout(()=>{if(!$('dlg').open)render()},200)});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
loadSnaps().then(()=>takeSnap('automatski')).then(()=>{if(ui.tab==='podesavanja')render()});
(function(){const q=new URLSearchParams(location.search);const t=q.get('tab');if(['nalozi','vozila','podsetnici','delovi','mehanicari','izvestaji','podesavanja'].includes(t))ui.tab=t;
  render();if(q.get('new')==='order')setTimeout(()=>openOrder(),50);
  setTimeout(checkNotif,1200);fbWrite().catch(()=>{})})();
authStart();
</script>
