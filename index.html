<style>
:root{--acc:#ea580c;--bg:#111318;--bg2:#171a21;--card:#1b1f27;--card2:#252a35;--line:rgba(255,255,255,.1);--txt:#f1f3f7;--muted:#9aa3b2;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--r:14px;--nav:64px}

   iPhone / iPad: samo kad je pokrenuta sa početnog ekrana (navigator.standalone === true — postoji samo u Apple WebKit-u).
   Mac: samo kao Safari veb-aplikacija iz Dock-a (display-mode: standalone).

<script>
'use strict';
if(window.ATMOS_BLOCKED)throw new Error('Atmos Radionica: otvori Android, Windows ili Apple aplikaciju');
/* iPhone / iPad (iPadOS se predstavlja kao Mac, ali ima ekran na dodir) */
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
const VER='1.9.7';
let authState='locked'; /* locked = mora prijava; ok = licenca važi; expired = licenca istekla (samo pregled) */
let RO=true; /* režim samo za pregled dok se ne potvrdi prijava */
const $=id=>document.getElementById(id);
const KEY='atmosRadionica1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isNaN(n)?0:n};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>ymd(new Date());
const dayDiff=s=>Math.round((new Date(s+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/864e5);
function addM(s,n){const [y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1+n,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return ymd(new Date(t.getFullYear(),t.getMonth(),Math.min(d,last)))}
const fmtDate=s=>{if(!s)return'—';const p=String(s).split('-');return p.length===3?`${p[2]}.${p[1]}.${p[0]}.`:s};
const fmtN=(n,d)=>(Number(n)||0).toLocaleString('sr-RS',{maximumFractionDigits:d==null?0:d});
const money=n=>{const r=Math.round(num(n)*100)/100;return r.toLocaleString('sr-RS',{minimumFractionDigits:Number.isInteger(r)?0:2,maximumFractionDigits:2})+' RSD'};
const md=n=>(Math.round(num(n)*100)/100).toLocaleString('sr-RS',{minimumFractionDigits:2,maximumFractionDigits:2});
const MSL=['Januar','Februar','Mart','April','Maj','Jun','Jul','Avgust','Septembar','Oktobar','Novembar','Decembar'];
const MS=['Jan','Feb','Mar','Apr','Maj','Jun','Jul','Avg','Sep','Okt','Nov','Dec'];
const ST={uzet:{l:'Uzet u rad',c:'#38bdf8'},obrada:{l:'U obradi',c:'#f59e0b'},zavrsen:{l:'Završen',c:'#34d399'}};
const FUELS=['Benzin','Dizel','Benzin + TNG','Hibrid','Elektro','Ostalo'];
const RK={bad:3,warn:2,ok:1,n:0};
const worst=(a,b)=>RK[b]>RK[a]?b:a;
const statCls={bad:'b-bad',warn:'b-warn',ok:'b-ok',n:'b-n'};

/* ---------- PODACI ---------- */
const DEF_MSG='Poštovani {ime}, Vaše vozilo {tablica} ({vozilo}) je završeno i spremno za preuzimanje. Iznos: {iznos}.\n{radionica}{telefon}';
const DEF_SET=()=>({theme:'dark',accent:'#ea580c',fs:'m',shop:{name:'',addr:'',city:'',phone:'',email:'',pib:'',mb:'',acc:'',bank:''},pdvRate:0,pdvIncl:true,labourRate:0,warnDays:14,warnKm:1000,autoRem:true,remMonths:12,remKm:10000,valid:7,docNote:'',invNote:'',backupDays:7,snapKeep:7,lastExport:'',lastFolder:'',fbName:'',notif:false,lastNotif:'',logo:'',sig:true,autoNotify:true,cc:'381',msgDone:DEF_MSG,warranty:0,ipsQr:true,ipsSf:'289'});
const fresh=()=>({v:1,settings:DEF_SET(),mechs:[],vehicles:[],orders:[],reminders:[],parts:[],clients:[],counters:{}});
function norm(d){const s=d.settings||{};d.settings=Object.assign(DEF_SET(),s);d.settings.shop=Object.assign(DEF_SET().shop,s.shop||{});['mechs','vehicles','orders','reminders','parts','clients'].forEach(k=>d[k]=Array.isArray(d[k])?d[k]:[]);d.counters=d.counters||{};return d}
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&typeof r==='object')return norm(r)}catch{}return fresh()}
let db=load();
const S=()=>db.settings;
const hasData=()=>db.vehicles.length||db.orders.length||db.reminders.length||db.mechs.length||db.parts.length||db.clients.length;
function persist(){if(RO)return true;if(demoOver()){db=load();toast(DEMO_LIMIT_MSG);setTimeout(render,0);return false}try{localStorage.setItem(KEY,JSON.stringify(db));if(typeof syncSoon==='function')syncSoon();return true}catch{toast('Greška pri čuvanju (memorija puna?) — napravi izvoz!');return false}}
let bkT=null;
/* backup u folder: najviše jednom dnevno (ručno „Backup sada“ upisuje uvek) */
const fbDoneToday=()=>!!S().lastFolder&&ymd(new Date(S().lastFolder))===todayStr();
function save(){persist();updateBadge();if(!fbDoneToday()){clearTimeout(bkT);bkT=setTimeout(()=>{fbWrite().catch(()=>{})},15000)}}
const vehById=id=>db.vehicles.find(v=>v.id===id);
const mechById=id=>db.mechs.find(m=>m.id===id);
const vehName=v=>[v.make,v.model].filter(Boolean).join(' ');
const vehLabel=v=>`${v.plate||'—'} — ${vehName(v)||'vozilo'}${v.owner?' — '+v.owner:''}`;
function nextNo(p){const y=new Date().getFullYear(),k=p+y;db.counters[k]=(db.counters[k]||0)+1;return `${p}-${y}-${String(db.counters[k]).padStart(4,'0')}`}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2800)}
async function download(name,text,mime){
  if(IOS&&window.isSecureContext&&navigator.share){try{const f=new File([text],name,{type:mime});if(!navigator.canShare||navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function setPath(o,p,v){const k=p.split('.');let c=o;while(k.length>1)c=c[k.shift()];c[k[0]]=v}

/* ---------- IndexedDB: interne kopije + folder ---------- */
const idbOpen=()=>new Promise((res,rej)=>{const r=indexedDB.open('atmosRadionicaDB',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbGet(k){const d=await idbOpen();return new Promise((res,rej)=>{const q=d.transaction('h').objectStore('h').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbSet(k,v){const d=await idbOpen();return new Promise((res,rej)=>{const t=d.transaction('h','readwrite');t.objectStore('h').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function idbDel(k){const d=await idbOpen();return new Promise((res,rej)=>{const t=d.transaction('h','readwrite');t.objectStore('h').delete(k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
let snaps=[];
async function loadSnaps(){try{snaps=(await idbGet('snaps'))||[]}catch{snaps=[]}}
async function takeSnap(reason,force){
  try{if(!hasData())return;const data=JSON.stringify(db);await loadSnaps();const day=todayStr();if(!force&&snaps.length&&snaps[0].day===day)return;
    snaps.unshift({t:new Date().toISOString(),day,reason:reason||'automatski',data});const keep=Math.max(1,Math.min(30,num(S().snapKeep)||7));while(snaps.length>keep)snaps.pop();await idbSet('snaps',snaps)}catch{}
}
async function restoreSnap(i){if(RO){roBlock();return}const s=snaps[i];if(!s)return;
  if(!confirm('Vratiti podatke iz kopije od '+new Date(s.t).toLocaleString('sr-RS')+'? Trenutno stanje se prvo sačuva.'))return;
  const data=s.data;await takeSnap('pre-vraćanja',true);db=norm(JSON.parse(data));persist();render();toast('Podaci vraćeni ✔')}

/* folder backup (File System Access API — Chrome/Edge na računaru) */
const fbSupported=()=>'showDirectoryPicker' in window;
let fbNeedPerm=false;
async function fbWrite(manual){if(authState==='demo')return false;
  const h=await idbGet('fbDir').catch(()=>null);if(!h)return false;
  let p=await h.queryPermission({mode:'readwrite'});
  if(p!=='granted'){fbNeedPerm=true;if(ui.tab==='podesavanja'||ui.tab==='pregled')bgRender();return false}
  fbNeedPerm=false;
  const f=await h.getFileHandle(`atmos-radionica-backup-${todayStr()}.json`,{create:true});
  const w=await f.createWritable();await w.write(JSON.stringify(db));await w.close();
  S().lastFolder=new Date().toISOString();persist();
  try{const names=[];for await(const [n] of h.entries()){if(/^atmos-radionica-backup-\d{4}-\d{2}-\d{2}\.json$/.test(n))names.push(n)}names.sort();const keep=Math.max(3,num(S().snapKeep)*2);while(names.length>keep)await h.removeEntry(names.shift())}catch{}
  if(manual)toast('Backup upisan u folder ✔');if(ui.tab==='podesavanja')bgRender();return true;
}
async function fbPick(){try{const h=await showDirectoryPicker({mode:'readwrite',id:'atmos-radionica'});await idbSet('fbDir',h);S().fbName=h.name;persist();await fbWrite(true)}catch(e){if(e&&e.name!=='AbortError')toast('Folder nije izabran')}render()}
async function fbAllow(){try{const h=await idbGet('fbDir');const p=await h.requestPermission({mode:'readwrite'});if(p==='granted'){await fbWrite(true)}}catch{toast('Dozvola nije data')}render()}
async function fbClear(){await idbDel('fbDir').catch(()=>{});S().fbName='';S().lastFolder='';fbNeedPerm=false;persist();render()}
function backupDue(){const n=num(S().backupDays);if(!n||!hasData())return false;if(!S().syncOff&&typeof sy!=='undefined'&&sy.last&&Date.now()-sy.last<7*864e5)return false;const last=[S().lastExport,(S().lastFolder||'').slice(0,10)].filter(Boolean).sort().pop();return !last||-dayDiff(last)>=n}

/* ---------- STATUSI / PODSETNICI ---------- */
function remStat(r){
  let lvl='n';const parts=[];
  if(r.dueDate){const d=dayDiff(r.dueDate),l=d<0?'bad':d<=num(S().warnDays)?'warn':'ok';parts.push(d<0?`kasni ${-d} d`:d===0?'danas':`za ${d} d`);lvl=worst(lvl,l)}
  const v=vehById(r.vehicleId);
  if(r.dueKm&&v&&num(v.km)){const rem=num(r.dueKm)-num(v.km),l=rem<0?'bad':rem<=num(S().warnKm)?'warn':'ok';parts.push(rem<0?`prešao ${fmtN(-rem)} km`:`još ${fmtN(rem)} km`);lvl=worst(lvl,l)}
  else if(r.dueKm)parts.push('na '+fmtN(r.dueKm)+' km');
  return{lvl,badge:parts.join(' · ')||'Bez roka'};
}

function updateBadge(){try{if(!navigator.setAppBadge)return;const n=alerts().length;n?navigator.setAppBadge(n):navigator.clearAppBadge()}catch{}}

  return `Poštovani${v.owner?' '+v.owner:''}, podsećamo Vas da je za vozilo ${v.plate||''}${vehName(v)?' ('+vehName(v)+')':''} vreme za: ${r.title}${due?' ('+due+')':''}. ${sh.name||''}${sh.phone?', tel. '+sh.phone:''}`.replace(/\s+/g,' ').trim()}
function ensureReminder(o){
  const v=vehById(o.vehicleId);if(!v)return;
  const auto=S().autoRem;if(!auto&&!o.nextDate&&!o.nextKm)return;
  const nd=o.nextDate||(auto&&num(S().remMonths)?addM(todayStr(),Math.round(num(S().remMonths))):'');
  const nk=o.nextKm||(auto&&num(S().remKm)&&num(o.km||v.km)?num(o.km||v.km)+num(S().remKm):'');
  if(!nd&&!nk)return;
  db.reminders.forEach(r=>{if(!r.done&&r.vehicleId===o.vehicleId&&r.title==='Redovni servis'&&r.id!==o.remId)r.done=true});
  let r=db.reminders.find(x=>x.id===o.remId);
  if(r){r.dueDate=nd;r.dueKm=nk;r.done=false}
  else{r={id:uid(),vehicleId:o.vehicleId,title:'Redovni servis',dueDate:nd,dueKm:nk,repMonths:num(S().remMonths)||'',repKm:num(S().remKm)||'',done:false,note:'Automatski posle naloga '+o.no};db.reminders.push(r);o.remId=r.id}
}

/* ---------- OBRAČUN ---------- */
function calc(o){
  let lab=0,part=0;(o.items||[]).forEach(i=>{const a=num(i.qty)*num(i.price);if(i.type==='deo')part+=a;else lab+=a});
  const sub=lab+part,disc=sub*num(o.discount)/100,after=sub-disc,r=num(S().pdvRate)/100;
  let base=after,pdv=0,total=after;
  if(r>0){if(S().pdvIncl){base=after/(1+r);pdv=after-base}else{pdv=after*r;total=after+pdv}}
  return{lab,part,sub,disc,after,base,pdv,total,r};
}
function totHtml(t){const row=(l,v,b)=>`<div class="row sp" style="padding:3px 0;${b?'font-weight:800;font-size:1.1rem;border-top:1px solid var(--line);margin-top:4px;padding-top:6px':''}"><span class="${b?'':'muted'}">${l}</span><span>${v}</span></div>`;
  return row('Rad',money(t.lab))+row('Delovi',money(t.part))+(t.disc?row('Popust',' − '+money(t.disc)):'')+(t.r>0?row('Osnovica',money(t.base))+row('PDV '+Math.round(t.r*100)+'%',money(t.pdv)):'')+row('UKUPNO',money(t.total),1)}

/* ---------- PREGLED: DANAS ----------
   Šta danas treba uraditi: kasni rok, rok danas, završeno a nenaplaćeno; i kratak učinak dana. */
function todayCard(act){
  const t=todayStr(),vl=o=>{const v=vehById(o.vehicleId)||{};return`<span class="plate">${esc(v.plate||'—')}</span>`},who=o=>{const v=vehById(o.vehicleId)||{};return esc([vehName(v),v.owner].filter(Boolean).join(' · '))};
  const late=act.filter(o=>o.promised&&o.promised<t).sort((a,b)=>a.promised.localeCompare(b.promised));
  const due=act.filter(o=>o.promised===t);
  const unpaid=db.orders.filter(o=>o.status==='zavrsen'&&!o.paid).sort((a,b)=>String(a.doneDate||a.date).localeCompare(String(b.doneDate||b.date)));
  const inT=db.orders.filter(o=>o.date===t).length,doneT=db.orders.filter(o=>o.status==='zavrsen'&&o.doneDate===t);
  const paidT=db.orders.filter(o=>o.paid&&o.paidDate===t).reduce((a,o)=>a+calc(o).total,0);
  const line=(o,cls,txt,btn)=>`<div class="alert ${cls}" style="cursor:default;flex-wrap:wrap;row-gap:6px"><div class="grow" data-act="editord" data-id="${o.id}" style="cursor:pointer;min-width:150px">${vl(o)} <b>${txt}</b><div class="small muted" style="margin-top:2px">${who(o)}</div></div><div class="row" style="gap:4px;margin-left:auto">${btn||''}</div></div>`;
  const todo=[
    ...late.map(o=>line(o,'bad','Kasni '+(-dayDiff(o.promised))+' d',`<button class="btn-s" data-act="editord" data-id="${o.id}">Otvori</button>`)),
    ...due.map(o=>line(o,'warn','Rok danas',`<button class="btn-s" data-act="editord" data-id="${o.id}">Otvori</button>`)),
    ...unpaid.slice(0,5).map(o=>line(o,'warn','Za naplatu '+money(calc(o).total),`${o.notified?'':`<button class="btn-s" data-act="notify" data-id="${o.id}" title="Mušterija nije obaveštena">💬 Obavesti</button>`}<button class="btn-s btn-p" data-act="paid" data-id="${o.id}">💳 Naplaćeno</button>`))];
  const more=unpaid.length>5?`<div class="small muted" style="margin-top:6px" data-act="gonalozi" data-st="unpaid">… i još ${unpaid.length-5} za naplatu →</div>`:'';
  const mini=(l,v,c)=>`<div style="flex:1;min-width:70px"><div class="small muted">${l}</div><b style="${c?'color:var(--'+c+')':''}">${v}</b></div>`;
  return`<div class="card"><h3>📅 Danas <span class="muted small">${fmtDate(t)}</span></h3>
   <div class="row wrap" style="gap:10px;margin-bottom:${todo.length?10:0}px">${mini('Primljeno',inT)}${mini('Završeno',doneT.length)}${mini('Naplaćeno',money(paidT),paidT?'ok':'')}${mini('Rok danas',due.length+(late.length?' · kasni '+late.length:''),late.length?'bad':due.length?'warn':'')}</div>
   ${todo.length?todo.join('')+more:'<div class="small muted">✔ Ništa ne kasni i sve završeno je naplaćeno.</div>'}</div>`;
}
function pgNalozi(){

  if(ui.st==='unpaid')l=l.filter(o=>o.status==='zavrsen'&&!o.paid);else if(ui.st!=='all')l=l.filter(o=>o.status===ui.st);

function repData(){
  const now=new Date(),cy=now.getFullYear(),M=ui.rp;
  let from,to='9999-12-31',lbl='';
  if(M==='m'){const [y,mo]=ui.rmon.split('-').map(Number);from=ui.rmon+'-01';to=ui.rmon+'-31';lbl=MSL[mo-1]+' '+y+'.'}
  else if(M==='y'){from=ui.ry+'-01-01';to=ui.ry+'-12-31';lbl=ui.ry+'. godina'}
  else{const N=+M||3;from=ymd(new Date(now.getFullYear(),now.getMonth()-(N-1),1));lbl='Poslednjih '+N+' meseca (od '+fmtDate(from)+')'}
  const dd=o=>o.doneDate||o.date||'';
  const l=db.orders.filter(o=>o.status==='zavrsen'&&dd(o)>=from&&dd(o)<=to).sort((a,b)=>dd(b).localeCompare(dd(a)));
  const tot=l.reduce((a,o)=>{const t=calc(o);a.lab+=t.lab*(1-num(o.discount)/100);a.part+=t.part*(1-num(o.discount)/100);a.total+=t.total;if(o.paid)a.paid+=t.total;return a},{lab:0,part:0,total:0,paid:0});
  const byM={};l.forEach(o=>{const k=dd(o).slice(0,7);byM[k]=byM[k]||{n:0,t:0};byM[k].n++;byM[k].t+=calc(o).total});
  const byMech={};l.forEach(o=>{const k=o.mechId||'-';byMech[k]=byMech[k]||{n:0,t:0};byMech[k].n++;byMech[k].t+=calc(o).total});
  const keys=M==='y'?Array.from({length:12},(_,i)=>ui.ry+'-'+pad(i+1)):Object.keys(byM).sort().reverse();
  const mx=Math.max(1,...keys.map(k=>byM[k]?byM[k].t:0));
  const mcount=ui.ry===String(cy)?now.getMonth()+1:12;
  return{now,cy,M,from,to,lbl,dd,l,tot,byM,byMech,keys,mx,mcount};
}

function pdfFromJpegs(pages){
  const enc=new TextEncoder(),parts=[],xref=[];let off=0;
  const push=b=>{const u=typeof b==='string'?enc.encode(b):b;parts.push(u);off+=u.length};
  const n=pages.length,PW=595.28,PH=841.89;
  push('%PDF-1.4\n');
  xref[1]=off;push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  xref[2]=off;push('2 0 obj\n<< /Type /Pages /Kids ['+pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] /Count '+n+' >>\nendobj\n');
  pages.forEach((pg,i)=>{
    const P=3+i*3,C=P+1,I=P+2,content=`q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
    xref[P]=off;push(`${P} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${I} 0 R >> >> /Contents ${C} 0 R >>\nendobj\n`);
    xref[C]=off;push(`${C} 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
    xref[I]=off;push(`${I} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${pg.w} /Height ${pg.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.bytes.length} >>\nstream\n`);push(pg.bytes);push('\nendstream\nendobj\n');
  });
  const total=3+n*3,xo=off;
  push('xref\n0 '+total+'\n0000000000 65535 f \n'+xref.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join(''));
  push('trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xo+'\n%%EOF');
  const out=new Uint8Array(off);let p=0;parts.forEach(u=>{out.set(u,p);p+=u.length});return out;
}
async function renderDocPages(){
  const W=703,MM=12,PWpx=794,PHpx=1123,MG=Math.round(MM/25.4*96),PAGE=PHpx-2*MG,SC=2;
  let css='';for(const sh of document.styleSheets){try{for(const r of sh.cssRules){if(r.type===1&&/\.doc\b|\.plate/.test(r.selectorText||''))css+=r.cssText}}catch{}}
  css+='.small{font-size:.8rem}.muted{color:#666}.doc{padding:0!important;margin:0!important;box-shadow:none!important;max-width:none!important;width:'+W+'px!important;box-sizing:border-box}';
  const inner='<style>'+css+'</style><div class="doc">'+$('docBody').innerHTML+'</div>';
  /* merenje u izolovanom iframe-u (isti kontekst kao pri crtanju u slici) */
  const host=document.createElement('iframe');host.style.cssText='position:fixed;left:-10000px;top:0;width:'+W+'px;height:4000px;border:0';
  host.srcdoc='<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}</style></head><body>'+inner+'</body></html>';
  document.body.appendChild(host);await new Promise(r=>{host.onload=r});
  try{
    const doc=host.contentDocument,d=doc.querySelector('.doc');await new Promise(r=>setTimeout(r,80));
    const imgs=[...d.querySelectorAll('img')];await Promise.all(imgs.map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
    const H=Math.ceil(d.getBoundingClientRect().height),top0=d.getBoundingClientRect().top,tops=[];
    [...d.children].forEach(c=>{if(!(c.previousElementSibling&&c.previousElementSibling.tagName==='H2'))tops.push(Math.round(c.getBoundingClientRect().top-top0))});
    d.querySelectorAll('.items').forEach(t=>{[...t.querySelectorAll('tr')].forEach((tr,i)=>{if(i>1)tops.push(Math.round(tr.getBoundingClientRect().top-top0))})});
    tops.sort((a,b)=>a-b);
    const br=[];let st=0;while(H-st>PAGE){const lim=st+PAGE;let b=-1;for(const t of tops)if(t>st+60&&t<=lim)b=t;if(b<0)b=lim;br.push([st,b]);st=b}br.push([st,H]);
    const wrap=document.createElement('div');wrap.style.cssText='width:'+W+'px;background:#fff';wrap.innerHTML=inner;
    const ser=new XMLSerializer().serializeToString(wrap);
    const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'"><foreignObject x="0" y="0" width="100%" height="100%">'+ser+'</foreignObject></svg>';
    const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('svg'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
    const full=document.createElement('canvas');full.width=W*SC;full.height=H*SC;const fc=full.getContext('2d');fc.fillStyle='#fff';fc.fillRect(0,0,full.width,full.height);fc.drawImage(img,0,0,W*SC,H*SC);
    const out=[];
    for(const [a,b] of br){
      const cv=document.createElement('canvas');cv.width=PWpx*SC;cv.height=PHpx*SC;const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);
      c.drawImage(full,0,a*SC,W*SC,(b-a)*SC,MG*SC,MG*SC,W*SC,(b-a)*SC);
      const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.92));
      out.push({bytes:new Uint8Array(await blob.arrayBuffer()),w:cv.width,h:cv.height});
    }
    return out;
  }finally{host.remove()}
}
async function docPdf(){
  const name=(docCtx.name||'dokument').replace(/[^\w\-]+/g,'_')+'.pdf';
  try{
    if(!docCtx.pdf){toast('Pravim PDF…');docCtx.pdf=new File([pdfFromJpegs(await renderDocPages())],name,{type:'application/pdf'})}
    const f=docCtx.pdf;

    const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('PDF preuzet ✔');
  }catch(e){docCtx.pdf=null;toast('PDF nije uspeo — koristi „Štampaj“ i sačuvaj kao PDF')}

const WMI={WVW:'Volkswagen',WV1:'Volkswagen',WV2:'Volkswagen',VWV:'Volkswagen',WAU:'Audi',TRU:'Audi',WBA:'BMW',WBS:'BMW',WDB:'Mercedes-Benz',WDD:'Mercedes-Benz',WDC:'Mercedes-Benz',W0L:'Opel',WF0:'Ford',VF1:'Renault',VF3:'Peugeot',VF7:'Citroën',ZFA:'Fiat',ZAR:'Alfa Romeo',TMB:'Škoda',UU1:'Dacia',VSS:'Seat',KMH:'Hyundai',KNA:'Kia',KND:'Kia',JTD:'Toyota',YV1:'Volvo',WP0:'Porsche',SAL:'Land Rover',ZCF:'Iveco',VNK:'Toyota',SJN:'Nissan',JMZ:'Mazda',JHM:'Honda',TSM:'Suzuki'};
const vinOK=v=>/^[A-HJ-NPR-Z0-9]{17}$/.test(v);
function vinHint(el){el.value=el.value.toUpperCase().replace(/\s/g,'');const v=el.value,h=$('vinHint');if(!h)return;
  if(!v){h.textContent='';return}

/* ---------- MUŠTERIJE ----------
   Mušterija ima više vozila (vozilo.clientId). Ime i telefon se čuvaju i na vozilu (vlasnik), radi štampe i pretrage.
   ID mušterije nastaje iz imena i telefona, pa dva uređaja koja povežu ista stara vozila naprave istu mušteriju. */
const cliById=id=>db.clients.find(c=>c.id===id);
const nName=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
const nPhone=s=>{let d=String(s||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('381'))d=d.slice(3);return d.replace(/^0+/,'')};
function cliId(name,phone){const t=nName(name)+'|'+nPhone(phone);let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)}return'c'+(h>>>0).toString(36)+t.length.toString(36)}
function findClient(name,phone){
  const p=nPhone(phone),n=nName(name);
  if(p.length>=6){const c=db.clients.find(c=>nPhone(c.phone)===p);if(c)return c}
  if(n)return db.clients.find(c=>nName(c.name)===n&&(!p||!nPhone(c.phone)))||null;
  return null;
}
/* poveži vozila sa mušterijama (pravi mušteriju kad ne postoji); vraća broj izmena */
function linkClients(){
  let n=0;
  db.vehicles.forEach(v=>{
    const c=v.clientId&&cliById(v.clientId);
    if(c){if(v.owner!==c.name||(c.phone&&v.phone!==c.phone)){v.owner=c.name;if(c.phone)v.phone=c.phone;n++}return}
    if(!nName(v.owner)){if(v.clientId){delete v.clientId;n++}return}
    let f=findClient(v.owner,v.phone);

/* ---------- NBS IPS QR (predračun i račun) ---------- */
/* tekući račun u 18 cifara (banka 3 + broj 13 + kontrolni 2), sa proverom kontrolnog broja (mod 97) */
function ipsAcc(a){
  const t=String(a||'').replace(/[^\d-]/g,'');if(!t)return'';
  let r;if(t.includes('-')){const p=t.split('-').filter(Boolean);if(p.length!==3||p[0].length>3||p[1].length>13||p[2].length>2)return'';r=p[0].padStart(3,'0')+p[1].padStart(13,'0')+p[2].padStart(2,'0')}else r=t;
  if(!/^\d{18}$/.test(r))return'';
  try{return BigInt(r)%97n===1n?r:''}catch{return r}
}
const ipsClean=(s,n)=>String(s||'').replace(/[|\r\n]+/g,' ').replace(/\s+/g,' ').trim().slice(0,n);
function ipsText(o,kind){
  const sh=S().shop,acc=ipsAcc(sh.acc),t=calc(o).total;
  if(!acc||!(t>0)||!ipsClean(sh.name,70))return'';
  const no=kind==='racun'?o.invNo:o.proNo;
  const nm=ipsClean(sh.name,40),place=ipsClean([sh.addr,sh.city].filter(Boolean).join(', '),66-nm.length);
  const ro=String(no||'').replace(/[^\d-]/g,'').replace(/^-+|-+$/g,'').replace(/-{2,}/g,'-');
  const f=['K:PR','V:01','C:1','R:'+acc,'N:'+nm+(place?'\r\n'+place:''),'I:RSD'+(Math.round(t*100)/100).toFixed(2).replace('.',','),'SF:'+(/^[12]\d\d$/.test(String(S().ipsSf))?S().ipsSf:'289'),
    'S:'+ipsClean((kind==='racun'?'Račun ':'Predračun ')+(no||''),35)];
  if(ro)f.push('RO:00'+ro.slice(0,23));
  return f.join('|');
}
function ipsBlock(o,kind){
  if(S().ipsQr===false||!window.AtmosQR||kind==='nalog'||(kind==='racun'&&o.paid))return'';
  const txt=ipsText(o,kind);if(!txt)return'';
  try{return`<div class="ipsqr">${AtmosQR.svg(txt,118)}<div><b>NBS IPS QR</b><br>Plati skeniranjem u aplikaciji m-banking (opcija „IPS skeniraj“). Iznos i podaci se popunjavaju sami.</div></div>`}catch{return''}
}

const CYR={А:'A',Б:'B',В:'V',Г:'G',Д:'D',Ђ:'Đ',Е:'E',Ж:'Ž',З:'Z',И:'I',Ј:'J',К:'K',Л:'L',Љ:'Lj',М:'M',Н:'N',Њ:'Nj',О:'O',П:'P',Р:'R',С:'S',Т:'T',Ћ:'Ć',У:'U',Ф:'F',Х:'H',Ц:'C',Ч:'Č',Џ:'Dž',Ш:'Š',а:'a',б:'b',в:'v',г:'g',д:'d',ђ:'đ',е:'e',ж:'ž',з:'z',и:'i',ј:'j',к:'k',л:'l',љ:'lj',м:'m',н:'n',њ:'nj',о:'o',п:'p',р:'r',с:'s',т:'t',ћ:'ć',у:'u',ф:'f',х:'h',ц:'c',ч:'č',џ:'dž',ш:'š'};
const translit=s=>String(s||'').replace(/[Ѐ-ӿ]/g,c=>CYR[c]!==undefined?CYR[c]:c);
const MAKES=['VOLKSWAGEN','VW','OPEL','FORD','RENAULT','PEUGEOT','CITROEN','CITROËN','FIAT','ZASTAVA','CRVENA ZASTAVA','SKODA','ŠKODA','AUDI','BMW','MERCEDES-BENZ','MERCEDES','TOYOTA','HYUNDAI','KIA','DACIA','SEAT','NISSAN','MAZDA','HONDA','SUZUKI','CHEVROLET','VOLVO','ALFA ROMEO','MITSUBISHI','YUGO','LANCIA','CHRYSLER','JEEP','LAND ROVER','MINI','SMART','SUBARU','PORSCHE','IVECO','DAEWOO','LADA','TOYOTA'];
const MAKE_NAME={VW:'Volkswagen','CRVENA ZASTAVA':'Zastava','MERCEDES-BENZ':'Mercedes-Benz',CITROEN:'Citroën',SKODA:'Škoda'};
const titleCase=s=>String(s||'').toLowerCase().replace(/(^|[\s\-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
function parseReg(raw){
  const txt=translit(raw).toUpperCase().replace(/[|_]/g,' ');
  const L=txt.split('\n').map(l=>l.replace(/[ \t]+/g,' ').trim()).filter(Boolean);
  const r={};
  /* VIN */
  const fixV=s=>s.replace(/[OQ]/g,'0').replace(/I/g,'1');
  const isV=s=>/^[A-HJ-NPR-Z0-9]{17}$/.test(s)&&/\d/.test(s)&&/[A-Z]/.test(s);
  const digits=s=>(s.match(/\d/g)||[]).length;
  outer:for(const joined of [false,true]){for(const l of L){const tk=l.split(' ');for(let i=0;i<tk.length;i++){let c='';for(let j=i;j<tk.length&&c.length<=17&&(joined||j===i);j++){c+=tk[j].replace(/[^A-Z0-9]/g,'');if(c.length===17&&digits(c)>=4){const f=fixV(c);if(isV(f)){r.vin=f;break outer}}}}}}
  /* tablica */
  const pm=/(?:^|[^A-Z0-9])([A-ZŠĐČĆŽ]{2})\s?[-–.]?\s?(\d{3,4})\s?[-–.]?\s?([A-ZŠĐČĆŽ]{2})(?![A-Z0-9])/;
  for(const l of L){if(r.vin&&l.replace(/[^A-Z0-9]/g,'').includes(r.vin))continue;const m=pm.exec(l);if(m){r.plate=`${m[1]} ${m[2]}-${m[3]}`;break}}
  /* pomoćne */
  const STOP=/^(MARKA|MAKE|TIP|VARIJANTA|VERZIJA|KOMERCIJALNA|OZNAKA|TRADE|NAME|PREZIME|NAZIV|IME|SURNAME|ADRESA|ADDRESS|SNAGA|ZAPREMINA|MOTORA|ENGINE|CAPACITY|POWER|GORIVO|FUEL|[\/\-:.,)])\s*/;
  const clean=s=>{s=String(s||'').trim();let p;do{p=s;s=s.replace(STOP,'')}while(s!==p);return s.trim()};
  const lab=(c,n)=>new RegExp('(?:^|\\s)\\(?'+c+'\\.?\\s?'+n+'\\)?[.:]?(?=\\s|$)');
  const after=re=>{for(let i=0;i<L.length;i++){const m=re.exec(L[i]);if(m){let rest=clean(L[i].slice(m.index+m[0].length));if(rest.length<2&&L[i+1])rest=clean(L[i+1]);return rest}}return''};
  /* kubikaža */
  let m=/(\d{3,4})\s?(?:CM3|CM³|CM\s?3|CCM|CM\b)/.exec(txt);let ccm=m?+m[1]:0;
  if(!ccm){const s=after(lab('P','1'));const mm=/\b(\d{3,4})\b/.exec(s);if(mm)ccm=+mm[1]}
  if(ccm>=600&&ccm<=9000)r.ccm=ccm;
  /* snaga */
  m=/(\d{2,3})(?:[.,]\d+)?\s?KW/.exec(txt);let kw=m?+m[1]:0;
  if(!kw){const s=after(lab('P','2'));const mm=/\b(\d{2,3})\b/.exec(s);if(mm)kw=+mm[1]}
  if(kw>=15&&kw<=600)r.kw=kw;
  /* gorivo */
  if(/DIZEL|DIESEL/.test(txt))r.fuel='Dizel';else if(/ELEKTR/.test(txt)&&!/BENZIN/.test(txt))r.fuel='Elektro';else if(/HIBRID|HYBRID/.test(txt))r.fuel='Hibrid';else if(/BENZIN|PETROL|GASOLINE/.test(txt))r.fuel=/TNG|LPG|AUTOGAS/.test(txt)?'Benzin + TNG':'Benzin';
  /* godina proizvodnje */
  for(let i=0;i<L.length;i++){if(/PROIZVOD|MANUFACT/.test(L[i])){const mm=/\b(19[5-9]\d|20[0-3]\d)\b/.exec(L[i]+' '+(L[i+1]||''));if(mm){r.year=+mm[1];break}}}
  /* marka */
  let mk=after(lab('D','1'));
  const known=MAKES.find(k=>new RegExp('(?:^|[^A-ZŠČĆŽĐ])'+k.replace(/[-]/g,'\\-')+'(?![A-ZŠČĆŽĐ])').test(txt));
  if(known)mk=known;else if(mk)mk=mk.split(' ')[0];
  if(mk){const up=mk.toUpperCase();r.make=MAKE_NAME[up]||titleCase(up)}
  else if(r.vin&&WMI[r.vin.slice(0,3)])r.make=WMI[r.vin.slice(0,3)];
  /* model */
  let md2=after(lab('D','3'));if(!md2)md2=after(lab('D','2'));
  if(md2&&md2.length>=2&&!/^\d+$/.test(md2)){md2=md2.replace(new RegExp('^'+(known||'@@@')+'\\s*'),'');if(md2)r.model=titleCase(md2.split(' ').slice(0,3).join(' '))}
  /* vlasnik */
  const sn=after(lab('C','1\\.?\\s?1')),nm=after(lab('C','1\\.?\\s?2'));
  const own=[nm,sn].map(x=>x.replace(/[^A-ZŠĐČĆŽ \-]/g,'').trim()).filter(x=>x.length>1).join(' ');
  if(own)r.owner=titleCase(own);
  return r;
}
const TESS='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let worker=null;
const sshow=h=>{$('scanBody').innerHTML=h};
function prog(t,p){const m=$('scMsg'),b=$('scBar');if(m)m.textContent=t;if(b&&p!=null)b.style.width=Math.round(p*100)+'%'}
const loadLib=()=>new Promise((res,rej)=>{if(window.Tesseract)return res();const s=document.createElement('script');s.src=TESS;s.onload=res;s.onerror=()=>rej(new Error('offline'));document.head.appendChild(s)});
async function ensureWorker(){
  if(worker)return;prog('Učitavam modul za prepoznavanje…',.08);await loadLib();
  const logger=m=>{if(m.status==='recognizing text')prog('Čitam tekst… '+Math.round(m.progress*100)+'%',.3+m.progress*.65);else if(/load|init/.test(m.status||''))prog('Učitavam jezike (prvi put ~10 MB)…',.15)};
  for(const langs of [['eng','srp_latn'],['eng']]){try{worker=await Tesseract.createWorker(langs,1,{logger});return}catch{worker=null}}
  throw new Error('offline');
}
function prep(bmp){
  let sc=Math.min(2600/Math.max(bmp.width,bmp.height),3);sc=Math.max(sc,.3);
  const w=Math.max(300,Math.round(bmp.width*sc)),h=Math.max(300,Math.round(bmp.height*sc));
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const c=cv.getContext('2d',{willReadFrequently:true});c.imageSmoothingQuality='high';c.drawImage(bmp,0,0,w,h);
  const im=c.getImageData(0,0,w,h),dd=im.data,hist=new Uint32Array(256),n=w*h;
  for(let i=0;i<dd.length;i+=4){const g=(dd[i]*299+dd[i+1]*587+dd[i+2]*114)/1000|0;dd[i]=g;hist[g]++}
  let lo=0,hi=255,a=0;for(;lo<255&&a+hist[lo]<n*.02;lo++)a+=hist[lo];a=0;for(;hi>0&&a+hist[hi]<n*.02;hi--)a+=hist[hi];
  const k=255/Math.max(hi-lo,30);
  for(let i=0;i<dd.length;i+=4){let v=((dd[i]-lo)*k)|0;v=v<0?0:v>255?255:v;dd[i]=dd[i+1]=dd[i+2]=v;dd[i+3]=255}
  c.putImageData(im,0,0);return cv;
}

async function runScan(file){if(RO){roBlock();return}

  try{
    let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch{bmp=await createImageBitmap(file)}

  }catch(err){
    sshow('<h3>Skeniranje nije uspelo</h3><p class="muted">'+esc(err&&err.message==='offline'?'Za prepoznavanje teksta potreban je internet (samo prvi put, posle se jezički paket pamti).':'Pokušaj sa oštrijom slikom, bez odsjaja i senki.')+'</p><div class="row"><button type="button" class="grow" id="scClose">Zatvori</button></div>');

    const track=w=>w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)showUpd()});
    if(reg.waiting&&navigator.serviceWorker.controller)showUpd();
    reg.addEventListener('updatefound',()=>track(reg.installing));

async function doLogin(){
  const u=$('auU').value.trim(),p=$('auP').value.trim(),msg=m=>{$('auMsg').textContent=m},go=$('auGo');
  if(!u||!p){msg('Unesi korisničko ime i PIN.');return}
  go.disabled=true;msg('Provera…');
  try{
    const r=await serverCheck(u,p);
    if(r.status==='ok'){storeAuth(u,p,r.days,r.expires);$('authDlg').close();setAuth('ok',u,r.days,r.expires);toast(r.days!=null&&r.days<=7?'Prijava uspešna — licenca ističe za '+r.days+' '+plDan(r.days):'Prijava uspešna ✔')}
    else if(r.status==='expired'){storeAuth(u,p,0,r.expires,true);$('authDlg').close();setAuth('expired',u,0,r.expires);toast('Licenca je istekla — samo pregled')}
    else if(r.status==='limit')msg(limitMsg(r));
    else if(r.status==='locked')msg(lockedMsg(r));
    else if(r.status==='blocked')msg(blockedMsg);
    else if(r.status==='update')msg('Osveži aplikaciju (zatvori je i ponovo otvori) pa se prijavi.');
    else msg('Pogrešno korisničko ime ili PIN.');
  }catch(err){
    const s=loadAuth();
    if(s&&s.u.toLowerCase()===u.toLowerCase()&&s.p===p&&freshAuth(s)){$('authDlg').close();const st=stateOf(s);setAuth(st,s.u,daysLeft(s),s.exp);toast('Prijava bez interneta (poslednja provera važi)')}
    else msg('Nema veze sa serverom — proveri internet.');
  }
  go.disabled=false;
}

    else if(r.status==='expired'){storeAuth(s.u,s.p,0,r.expires,true);if(authState!=='expired')setAuth('expired',s.u,0,r.expires)}
    else if(r.status==='limit'){clearAuth();lock(limitMsg(r))}

    else{clearAuth();lock('PIN više nije važeći. Prijavi se ponovo.')}
  }catch{
    /* nema mreže: važi poslednja uspešna provera do OFFLINE_DAYS */
    if(!freshAuth(s)&&authState!=='locked'){lock('Predugo bez provere sa serverom (najviše '+OFFLINE_DAYS+' dana) — poveži se na internet i prijavi se.')}

  }
}

      admDlg(`<h3>➕ Novi korisnik</h3>
       <label class="l">Korisničko ime</label><input class="fld" id="anU" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="npr. servis.markovic" style="margin-bottom:8px">
       <label class="l">PIN</label><div class="row" style="gap:6px;margin-bottom:8px"><input class="fld grow" id="anP" value="${admPin()}" autocomplete="off"><button class="btn-s" data-act="admgen" data-t="anP">🎲</button></div>
       <div class="grid g2"><div><label class="l">Važi do</label><input class="fld" id="anE" type="date" value="${isoDate(d1)}"></div><div><label class="l">Najviše uređaja</label><input class="fld" id="anM" type="number" inputmode="numeric" value="3" min="1"></div></div>
       <label class="row small" style="margin:8px 0"><input type="checkbox" id="anN" style="width:18px;height:18px"> Bez ograničenja (licenca ne ističe)</label>
       <button class="btn-p" data-act="admadd" style="width:100%">💾 Dodaj korisnika</button>`);return}
    case'admgen':{const el=$(d.t);if(el)el.value=admPin();return}
    case'admadd':{const name=$('anU').value.trim(),pin=$('anP').value.trim(),exp=$('anN').checked?'':$('anE').value,max=$('anM').value;
      if(!name||!pin){toast('Upiši korisničko ime i PIN');return}
      if(await admCall('add',{target:name,newPin:pin,exp,max},'Korisnik dodat ✔')){admShowSend(name)}return}
    case'admext':if(!u)return;
      admDlg(`<h3>⏳ Produži licencu — ${esc(u.user)}</h3><div class="small muted" style="margin-bottom:10px">Sada: ${u.days==null&&u.status==='ok'?'neograničeno':u.status==='expired'?'istekla '+esc(u.exp)+' (produžava se od danas)':'važi do '+esc(u.exp)}</div>
       <div class="grid g2"><button class="btn-p" data-act="admextn" data-u="${esc(u.user)}" data-m="1">+1 mesec</button><button class="btn-p" data-act="admextn" data-u="${esc(u.user)}" data-m="3">+3 meseca</button><button class="btn-p" data-act="admextn" data-u="${esc(u.user)}" data-m="6">+6 meseci</button><button class="btn-p" data-act="admextn" data-u="${esc(u.user)}" data-m="12">+1 godina</button></div>
       <label class="l" style="margin-top:12px">Ili tačan datum</label><div class="row" style="gap:6px"><input class="fld grow" id="aeD" type="date"><button data-act="admextd" data-u="${esc(u.user)}">Postavi</button></div>
       <button class="btn-s" data-act="admextu" data-u="${esc(u.user)}" style="margin-top:10px;width:100%">♾ Bez ograničenja</button>`);return;
    case'admextn':if(await admCall('extend',{target:n,months:+d.m},'Licenca produžena ✔'))$('dlg').close();return;
    case'admextd':{const v=$('aeD').value;if(!v){toast('Izaberi datum');return}if(await admCall('update',{target:n,exp:v},'Datum postavljen ✔'))$('dlg').close();return}
    case'admextu':if(confirm('Licenca za '+n+' bez ograničenja?')&&await admCall('update',{target:n,exp:''},'Licenca bez ograničenja ✔'))$('dlg').close();return;
    case'admedit':if(!u)return;
      admDlg(`<h3>✏️ ${esc(u.user)}</h3>
       <label class="l">PIN</label><div class="row" style="gap:6px;margin-bottom:8px"><input class="fld grow" id="aiP" value="${esc(u.pin)}" autocomplete="off"><button class="btn-s" data-act="admgen" data-t="aiP">🎲</button></div>
       <label class="l">Najviše uređaja</label><input class="fld" id="aiM" type="number" inputmode="numeric" min="1" value="${u.max}" style="margin-bottom:10px">
       <button class="btn-p" data-act="admsave" data-u="${esc(u.user)}" style="width:100%">💾 Sačuvaj</button>
       <div class="small muted" style="margin-top:8px">Promena PIN-a odjavljuje korisnika na svim uređajima pri sledećoj proveri — pošalji mu nov PIN.</div>`);return;
    case'admsave':{const pin=$('aiP').value.trim(),max=$('aiM').value,x={target:n,max};if(pin!==u.pin)x.newPin=pin;
      if(await admCall('update',x,'Sačuvano ✔')){if(x.newPin)admShowSend(n);else $('dlg').close()}return}
    case'admdev':if(!u)return;
      admDlg(`<h3>📱 Uređaji — ${esc(u.user)}</h3><div class="small muted" style="margin-bottom:8px">Aktivnih ${u.devs.filter(x=>!x.blocked).length} od ${u.max}. „Oslobodi“ briše uređaj (npr. promenio telefon); „Isključi“ ga trajno blokira.</div>
       ${u.devs.length?u.devs.map(x=>`<div class="small" style="padding:8px 0;border-bottom:1px solid var(--line)"><div>${x.blocked?'⛔':'✅'} <b>${esc(x.name||'Uređaj')}</b> <span class="muted">· poslednji put ${esc(x.date)} · ID ${esc(x.id.slice(0,6))}…</span></div><div class="row" style="gap:6px;margin-top:6px">${x.blocked?`<button class="btn-s" data-act="admdevx" data-u="${esc(u.user)}" data-id="${x.id}" data-x="unblock">Uključi</button>`:`<button class="btn-s" data-act="admdevx" data-u="${esc(u.user)}" data-id="${x.id}" data-x="block">Isključi</button>`}<button class="btn-s btn-d" data-act="admdevx" data-u="${esc(u.user)}" data-id="${x.id}" data-x="free">Oslobodi</button></div></div>`).join(''):'<div class="small muted">Nema prijavljenih uređaja.</div>'}`);return;
    case'admdevx':if(d.x==='free'&&!confirm('Osloboditi mesto ovog uređaja?'))return;
      if(await admCall('device',{target:n,id:d.id,act:d.x},'Sačuvano ✔'))admAct('admdev',{u:n});return;
    case'admsend':admShowSend(n);return;
    case'admsharev':{const t=$('admTxt').value;try{await navigator.clipboard.writeText(t)}catch{}location.href='viber://forward?text='+encodeURIComponent(t);return}
    case'admsharew':window.open('https://wa.me/?text='+encodeURIComponent($('admTxt').value),'_blank');return;
    case'admsharec':try{await navigator.clipboard.writeText($('admTxt').value);toast('Kopirano ✔')}catch{toast('Kopiranje nije uspelo')}return;
    case'admshare':shareText('Atmos Radionica',$('admTxt').value);return;
    case'admdel':if(!u)return;if(confirm('Obrisati korisnika '+n+'? Biće odjavljen na svim uređajima. Podaci njegove radionice ostaju sačuvani na serveru.')&&confirm('Sigurno obrisati '+n+'?'))await admCall('delete',{target:n},'Korisnik obrisan');return;
  }
}

/* ---------- SINHRONIZACIJA IZMEĐU UREĐAJA ----------
   Svi uređaji istog naloga dele podatke preko Google Apps Script-a (Code.gs sync-1).
   Šalju se samo izmenjeni zapisi: posle čuvanja (za ~5 s), na svakih 5 min i pri pokretanju.
   Bez interneta sve radi lokalno, izmene odlaze kad se veza vrati. Ako isti zapis menjaju dva uređaja, važi kasnija izmena. */
const SYNC_KEY='atmosSync1',SYNC_COLLS=['mechs','vehicles','orders','reminders','parts','clients'],SYNC_MIN=5;
/* podešavanja koja važe samo za ovaj uređaj (ne šalju se drugima) */
const LOCAL_SET=['theme','accent','fs','backupDays','snapKeep','lastExport','lastFolder','fbName','notif','lastNotif','syncOff'];
let sy=(()=>{try{const x=JSON.parse(localStorage.getItem(SYNC_KEY));if(x&&typeof x==='object'&&x.h)return x}catch{}return{rev:0,h:{},last:0,err:''}})();
let syBusy=false,syT=null,syMsg='';
const syOn=()=>!S().syncOff;
function syStore(){try{localStorage.setItem(SYNC_KEY,JSON.stringify(sy))}catch{}}
function syHash(o){const t=JSON.stringify(o);let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)+t.length.toString(36)}
function sySharedSet(){const o={};Object.keys(S()).forEach(k=>{if(!LOCAL_SET.includes(k))o[k]=S()[k]});return o}
/* trenutno stanje: ključ → zapis */
function syLocal(){const m={};SYNC_COLLS.forEach(c=>db[c].forEach(r=>{if(r&&r.id)m[c+'/'+r.id]=r}));m._set=sySharedSet();return m}
function syncSoon(ms){clearTimeout(syT);syT=setTimeout(()=>syncNow(),ms==null?5000:ms)}
async function syncNow(manual){
  if(syBusy||authState==='locked'||(!syOn()&&!manual))return;
  const s=loadAuth();if(!s)return;
  /* podaci na uređaju pripadaju drugom nalogu → ne mešaj ih */
  if(sy.user&&sy.user!==s.u.toLowerCase()){syMsg='';if(manual)toast('Prvo izaberi šta da se radi sa podacima ovog uređaja');if(ui.tab==='podesavanja')bgRender();return}
  if(!navigator.onLine){syMsg='Nema interneta — izmene čekaju';if(manual)toast(syMsg);return}
  /* dok je otvoren prozor za izmenu, sačekaj da se zatvori */
  if(document.querySelector('dialog[open]')){syncSoon(20000);return}
  syBusy=true;if(manual){syMsg='Sinhronizacija…';if(ui.tab==='podesavanja')bgRender()}
  try{
    const loc=syLocal(),changes={},sent={};
    if(authState==='ok'){
      Object.keys(loc).forEach(k=>{const h=syHash(loc[k]);if(sy.h[k]!==h){changes[k]=loc[k];sent[k]=h}});
      Object.keys(sy.h).forEach(k=>{if(!(k in loc)){changes[k]=null;sent[k]=null}});
    }
    const r=await fetch(AUTH_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',
      body:JSON.stringify({a:'sync',user:s.u,pin:s.p,device:deviceId(),dname:deviceName(),since:sy.rev,changes,counters:authState==='ok'?db.counters:{}})});
    if(!r.ok)throw new Error('http '+r.status);
    const j=await r.json();
    if(j.status==='limit'){clearAuth();lock(limitMsg(j));return}
    if(j.status==='locked'){syMsg='Server privremeno odbija prijavu (previše pogrešnih PIN-ova) — pokušaću kasnije';return}
    if(j.status==='blocked'){clearAuth();lock(blockedMsg);return}
    if(j.status==='invalid'){clearAuth();lock('PIN više nije važeći. Prijavi se ponovo.');return}
    if(j.status!=='ok'&&j.status!=='expired'||j.rev==null){syMsg=j.v&&j.v!=='sync-1'?'Server još nema sinhronizaciju (Code.gs)':'Greška servera';sy.err=syMsg;syStore();return}
    if(j.maxDevices!=null)authDev={n:Number(j.devices)||0,max:Number(j.maxDevices)};
    if(j.v==='sync-1')Object.keys(sent).forEach(k=>{if(k.startsWith('clients/'))delete sent[k]});
    /* poslato je sada na serveru */
    Object.keys(sent).forEach(k=>{if(sent[k]===null)delete sy.h[k];else sy.h[k]=sent[k]});
    /* primeni tuđe izmene; preskoči zapise koje je korisnik menjao dok je zahtev trajao */
    const now=syLocal();let got=0;
    Object.keys(j.changes||{}).forEach(k=>{
      const cur=now[k]?syHash(now[k]):null;
      if(cur!==(k in sy.h?sy.h[k]:null))return;           /* lokalna izmena u toku → ostaje, šalje se sledeći put */
      const v=j.changes[k];
      if(k==='_set'){if(v){const keep={};LOCAL_SET.forEach(x=>{if(x in S())keep[x]=S()[x]});const ns=Object.assign(DEF_SET(),v,keep);ns.shop=Object.assign(DEF_SET().shop,v.shop||{});if(syHash(sySharedSet())!==syHash(Object.fromEntries(Object.keys(ns).filter(x=>!LOCAL_SET.includes(x)).map(x=>[x,ns[x]])))){db.settings=ns;got++}sy.h[k]=syHash(sySharedSet())}return}
      const [c,id]=k.split('/');if(!SYNC_COLLS.includes(c))return;
      const i=db[c].findIndex(x=>x.id===id);
      if(v){if(i>=0)db[c][i]=v;else db[c].push(v);sy.h[k]=syHash(v)}
      else{if(i>=0)db[c].splice(i,1);delete sy.h[k]}
      got++;
    });
    if(got&&linkClients()&&authState==='ok')syncSoon(3000);
    Object.keys(j.counters||{}).forEach(k=>{const n=Number(j.counters[k])||0;if(n>(db.counters[k]||0)){db.counters[k]=n;got++}});
    sy.rev=j.rev;sy.last=Date.now();sy.err='';sy.user=s.u.toLowerCase();syStore();
    if(got){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}updateBadge();if(!document.querySelector('dialog[open]')&&$('docView').hidden)bgRender()}
    syMsg='';if(manual)toast(got?'Sinhronizovano ✔ — stiglo izmena: '+got:'Sinhronizovano ✔');
    if(ui.tab==='podesavanja'&&!got)bgRender();
  }catch(e){syMsg='Nema veze sa serverom — pokušaću ponovo';sy.err=syMsg;syStore();if(manual)toast(syMsg)}
  finally{syBusy=false}
}
function syncStart(){
  setInterval(()=>syncNow(),SYNC_MIN*60*1000);
  addEventListener('online',()=>syncSoon(2000));
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-sy.last>60000)syncSoon(1500)});
}
function syncCard(){if(authState==='demo')return`<div class="card"><h3>🔄 Sinhronizacija između uređaja</h3><div class="small muted">U demo verziji podaci ostaju samo na ovom uređaju. Posle aktivacije sinhronizacija radi automatski, a podaci iz demo verzije se zadržavaju.</div></div>`;
  const t=sy.last?new Date(sy.last).toLocaleString('sr-RS',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'nikad';
  const st=!syOn()?'Isključena na ovom uređaju':syBusy?'Sinhronizacija…':syMsg||sy.err||'✔ Radi';
  const bad=syOn()&&(syMsg||sy.err)&&!syBusy;
  const other=sy.user&&authUser&&sy.user!==authUser.toLowerCase();
  if(other)return`<div class="card" style="border-color:var(--warn)"><h3>🔄 Sinhronizacija je pauzirana</h3>
   <div class="small" style="margin-bottom:10px">Podaci na ovom uređaju su do sada sinhronizovani sa nalogom <b>${esc(sy.user)}</b>, a sada si prijavljen kao <b>${esc(authUser)}</b>. Izaberi šta je tačno:</div>
   <button class="btn-p" data-act="syadopt" style="width:100%;margin-bottom:6px">✔ To je isti nalog (promenjeno ime) — prenesi podatke na ${esc(authUser)}</button>
   <div class="small muted" style="margin:0 2px 12px">Svi podaci sa ovog uređaja se šalju na nalog ${esc(authUser)} i spajaju sa onim što tamo već postoji.</div>
   <button data-act="syfresh" style="width:100%;margin-bottom:6px">⬇ Drugi nalog — preuzmi samo podatke naloga ${esc(authUser)}</button>
   <div class="small muted" style="margin:0 2px">Podaci naloga ${esc(sy.user)} sa ovog uređaja se prvo čuvaju u automatskoj kopiji, pa se uklanjaju sa uređaja.</div></div>`;
  return`<div class="card"><h3>🔄 Sinhronizacija između uređaja</h3>
   <div class="small muted" style="margin-bottom:8px">Svi uređaji prijavljeni na nalog <b>${esc(authUser)}</b> dele iste naloge, vozila, podsetnike, delove, mehaničare i podatke radionice. Izmene se šalju par sekundi posle čuvanja i na svakih ${SYNC_MIN} minuta.</div>
   <div class="row sp" style="padding:6px 0;border-bottom:1px solid var(--line);gap:12px;align-items:flex-start"><span class="muted" style="flex:none">Stanje</span><b style="text-align:right;${bad?'color:var(--warn)':''}">${esc(st)}</b></div>
   <div class="row sp" style="padding:6px 0;border-bottom:1px solid var(--line);margin-bottom:10px"><span class="muted">Poslednja sinhronizacija</span><b>${esc(t)}</b></div>
   <div class="row wrap" style="gap:8px"><button class="btn-p grow" data-act="syncnow" ${syOn()?'':'disabled'}>🔄 Sinhronizuj sada</button><button class="grow" data-act="synctoggle">${syOn()?'⏸ Isključi':'▶ Uključi'}</button></div></div>`;
}
function authStart(){
  $('authBtn').onclick=()=>{if(authState==='demo'||demoExpired()){openAuth();return}if(confirm('Odjaviti se? Za ponovni ulaz biće potrebni korisničko ime i PIN.')){clearAuth();lock()}};
  const s=loadAuth();if(s&&s.dev)authDev=s.dev;
  if(s&&freshAuth(s)){setAuth(stateOf(s),s.u,daysLeft(s),s.exp);authRecheck()}
  else if(!s&&demoRec()){if(demoLeft()>0)setAuth('demo','Demo',demoLeft());else{setAuth('expired','Demo');openAuth('Probni period je istekao. Prijavi se ili se javi za aktivaciju.')}}
  else lock(s?'Prijava je istekla — poveži se na internet i prijavi se ponovo.':'');
  setInterval(authRecheck,RECHECK_MIN*60*1000);
  syncStart();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)authRecheck()});
}

/* ---------- START ---------- */
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',()=>S().theme==='auto'&&applyTheme());
/* ponovno crtanje samo kad se promeni ŠIRINA (npr. okretanje telefona). Otvaranje tastature na telefonu menja samo visinu —
   ranije je to iscrtavalo ekran iznova i odmah zatvaralo tastaturu. */
let lastW=innerWidth;
addEventListener('resize',()=>{clearTimeout(addEventListener.t);addEventListener.t=setTimeout(()=>{if(innerWidth===lastW)return;lastW=innerWidth;if(!$('dlg').open)bgRender()},200)});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
loadSnaps().then(()=>takeSnap('automatski')).then(()=>{if(ui.tab==='podesavanja')bgRender()});
(function(){if(linkClients()){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}}
  const q=new URLSearchParams(location.search);const t=q.get('tab');if(['nalozi','vozila','musterije','podsetnici','delovi','mehanicari','izvestaji','podesavanja'].includes(t))ui.tab=t;
  render();if(q.get('new')==='order')setTimeout(()=>openOrder(),50);
  setTimeout(checkNotif,1200);if(!fbDoneToday())fbWrite().catch(()=>{})})();
authStart();
</script>
